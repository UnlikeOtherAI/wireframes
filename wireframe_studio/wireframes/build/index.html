    <style>*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#374151}

.wf-heading h1,.wf-heading h2,.wf-heading h3,.wf-heading h4,.wf-heading h5,.wf-heading h6{margin:0;color:var(--wf-ink)}

.wf-section,.wf-card,.wf-stack,.wf-row,.wf-grid,.wf-split,.wf-form{min-width:0}
.wf-card-media{margin:-16px -16px 0;overflow:hidden;border-radius:var(--wf-surface-radius,6px) var(--wf-surface-radius,6px) 0 0}
.wf-card-media img{width:100%;display:block;border:none;border-radius:0}
.wf-row>.wf-node-children{display:flex;flex-direction:inherit;gap:inherit;align-items:inherit;justify-content:inherit;flex-wrap:inherit;flex:1 1 auto;min-width:0}
.wf-form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.wf-split>.wf-node-children{display:flex;flex-direction:inherit;gap:inherit;align-items:stretch;flex:1 1 auto;min-width:0}
.wf-split>.wf-node-children>.wf-node:not(.wf-pane){flex:1 1 0;min-width:0}
.wf-carousel{position:relative;padding:0;overflow:hidden}
.wf-carousel-track{display:flex;flex:1 1 auto;gap:12px;padding:14px;min-width:0}
.wf-slide{flex:1 1 0;min-width:140px;min-height:120px;display:flex;align-items:center;justify-content:center;padding:14px;font-size:13px;color:var(--wf-ink-3);background:var(--wf-fill-2);border:1px solid var(--wf-line-2);border-radius:var(--wf-corner-radius,6px)}
.wf-mode-line .wf-slide{background:transparent;border-color:var(--wf-line);border-radius:0}

.wf-carousel .wf-pagination-dots{justify-content:center;margin:0 auto 12px}
.wf-overlay{min-width:0}
.wf-pane-right{margin-left:auto}
.wf-pane-center{flex:1 1 auto;min-width:0}

.wf-density-compact .wf-table-cell{padding:7px 12px}
.wf-density-compact .wf-list-row{padding:8px 12px;min-height:36px}
.wf-badge{display:inline-flex;width:fit-content;max-width:100%}
.wf-badge-body{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;font-size:11px;font-weight:500;line-height:1.6;color:var(--wf-ink-2);background:var(--wf-fill);border:1px solid transparent;border-radius:10px;white-space:nowrap}
.wf-mode-line .wf-badge-body{background:transparent;border-color:var(--wf-line-strong);border-radius:0}
.wf-badge-outline .wf-badge-body{background:transparent;border-color:var(--wf-line)}
.wf-badge-pill .wf-badge-body{border-radius:10px}

.wf-dot-mark{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wf-ink-3);flex:0 0 auto}
.wf-avatar{display:inline-flex;width:fit-content}
.wf-avatar-chip{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--wf-fill);border:1px solid var(--wf-line);color:var(--wf-ink-2);font-weight:600;letter-spacing:.02em}
.wf-mode-line .wf-avatar-chip{background:transparent;border-color:var(--wf-line-strong)}
.wf-avatar-img img{width:100%;height:100%;object-fit:cover;display:block}
.wf-avatar-img{display:inline-block;overflow:hidden;border:1px solid var(--wf-line)}
.wf-avatar-group{display:inline-flex;align-items:center}

.wf-avatar-group .wf-avatar-chip{box-shadow:0 0 0 2px #ffffff}
.wf-avatar-more{display:inline-flex;align-items:center;margin-left:6px;font-size:12px;color:var(--wf-ink-3)}
.wf-image{display:block;max-width:100%;min-width:0}

.wf-mode-line .wf-image img{border-color:var(--wf-line-strong);border-radius:0}
.wf-image-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;min-height:120px;padding:16px;text-align:center;color:var(--wf-ink-4);border:1px solid var(--wf-line);border-radius:var(--wf-surface-radius,6px);background:linear-gradient(to top right,transparent calc(50% - .5px),var(--wf-line-2),transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - .5px),var(--wf-line-2),transparent calc(50% + .5px)),var(--wf-fill-2)}
.wf-mode-line .wf-image-placeholder{border-color:var(--wf-line-strong);border-radius:0;background:linear-gradient(to top right,transparent calc(50% - .5px),var(--wf-line),transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - .5px),var(--wf-line),transparent calc(50% + .5px))}
.wf-image-placeholder .wf-icon-glyph{font-size:22px;color:var(--wf-ink-4)}
.wf-image-caption{font-size:12px}
.wf-rating{display:inline-flex;align-items:center;gap:1px;color:var(--wf-ink-3);font-size:14px}
.wf-star-on{color:var(--wf-ink)}
.wf-rating-count{margin-left:6px;font-size:12px;color:var(--wf-ink-3)}
.wf-stat{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.wf-stat[data-wf-frame="surface"]{padding:16px}
.wf-stat-head{display:flex;align-items:center;gap:8px;min-width:0}
.wf-stat-label{font-size:12px;font-weight:500;color:var(--wf-ink-3);text-transform:uppercase;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wf-stat-spark{width:100%;height:22px;display:block;fill:none;stroke:var(--wf-ink-4);stroke-width:1.5}
.wf-progress{display:flex;flex-direction:column;gap:5px;min-width:0}

.wf-mode-card .wf-button-link button,.wf-mode-card .wf-button-link .wf-button-link{background:transparent;color:var(--wf-ink);text-decoration:underline;min-width:0;padding:0}
