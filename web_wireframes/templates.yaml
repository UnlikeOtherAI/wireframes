documentType: templates
specVersion: "1.1"
id: templates
templates:
  public_template:
    layout:
      type: stack
    regions:
      - id: site_header
        kind: persistent
        sticky: top
        layout:
          type: row
          padding: 16
          gap: 16
          align: center
        children:
          - id: logo_icon
            component: icon
            props:
              name: vector-square
              size: lg
          - id: logo_text
            component: heading
            props:
              label: Wireframes
              level: 4
          - id: nav_features
            component: button
            props:
              label: "Features"
            interaction:
              - type: navigation
                targetRoute: home
          - id: nav_docs
            component: button
            props:
              label: "Docs"
            interaction:
              - type: navigation
                targetRoute: home
          - id: header_spacer
            component: spacer
            size:
              width: "100%"
          - id: login_btn
            component: button
            props:
              label: "Sign In"
              icon: right-to-bracket
            interaction:
              - type: navigation
                targetRoute: login
      - id: main
        kind: slot
      - id: site_footer
        kind: persistent
        layout:
          type: row
          padding: 24
          gap: 24
          align: center
        children:
          - id: footer_copy
            component: text
            props:
              label: "2026 Wireframes. All rights reserved."
          - id: footer_spacer
            component: spacer
            size:
              width: "100%"
          - id: footer_terms
            component: button
            props:
              label: "Terms"
            interaction:
              - type: navigation
                targetRoute: home
          - id: footer_privacy
            component: button
            props:
              label: "Privacy"
            interaction:
              - type: navigation
                targetRoute: home

  login_template:
    layout:
      type: stack
      align: center
      justify: center
    regions:
      - id: login_content
        kind: slot
