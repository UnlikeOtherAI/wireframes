# ============================================================
# Wireframe Schema — Full Canonical YAML Definition
# Version: 1.1
# Purpose: Deterministic UI Architecture Specification
# ============================================================

schema:
  name: Wireframe Specification
  version: "1.1"
  description: >
    Deterministic declarative UI architecture format designed for
    template-based applications, reusable components, datasets,
    overlays, and strict validation. Git-native. Machine-readable.
    Export-safe. No runtime logic embedded.

# ============================================================
# 1. GLOBAL DOCUMENT CONTRACT
# ============================================================

document:
  requiredFields:
    - documentType
    - specVersion
    - id

  documentTypes:
    - manifest
    - sitemap
    - templates
    - components
    - page
    - dataset

  specVersionRequired: true

# ============================================================
# 2. PROJECT STRUCTURE
# ============================================================

projectStructure:
  root: /wireframe
  requiredFiles:
    - manifest.yaml
    - sitemap.yaml
    - templates.yaml
    - components.yaml
  optionalFiles:
    - .wfrc.yaml
  requiredFolders:
    - /pages
  optionalFolders:
    - /data
    - /assets
  notes:
    - additional documentType: components files may live anywhere under the project root
    - reusable component lookup is driven by explicit imports, not folder names

# ============================================================
# 3. ID RULES
# ============================================================

idRules:
  format: "^[a-z][a-z0-9_]*$"
  componentReferenceFormat: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"
  globalUniqueness:
    - route.id
    - template.id
    - component.id
    - page.id
    - dataset.id
  treeUniqueness:
    - node.id
    - overlay.id
  namingConventions:
    - snake_case only
    - no uppercase
    - no ambiguous names
    - no reserved keywords

documentImports:
  format: "{ alias: ./relative/path.yaml }"
  aliasFormat: "^[a-z][a-z0-9_]*$"
  validOn:
    - templates
    - components
    - page
  targetRule:
    - target file must be a valid documentType: components document
    - imports resolve relative to the importing document
    - import alias scope is local to the importing document
    - duplicate alias-qualified component IDs within one resolved page are invalid

# ============================================================
# 4. ADDRESSING MODEL
# ============================================================

addressing:
  canonicalFormat: "wf://<doctype>/<docid>#<path>"
  doctypeValues:
    - page
    - template
    - component
    - data
  path:
    separator: "."
    segments: "node ids only"
  datasetItem:
    format: "wf://data/<datasetId>#items:<primaryKey>=<value>"
  noIndexAddressing: true

# ============================================================
# 4.1 SITEMAP MODEL
# ============================================================

sitemap:
  required:
    - routes
  optional:
    - defaultTemplate
    - appState
    - contexts

  contexts:
    description: >
      Named responsive breakpoints. Keys are context names,
      values define minWidth/maxWidth ranges.

# ============================================================
# 5. STATE SYSTEM
# ============================================================

state:
  scopes:
    appState:
      location: sitemap.yaml
      persistsAcrossRoutes: true
    pageState:
      location: page.yaml
      resetsOnNavigation: true

  keyFormat: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"

  expressionFormat: >
    {{state.key}} |
    {{appState.key}} |
    {{route.id}} |
    {{event.field}} |
    {{props.key}} |
    {{item.field}}

  noFreeformExpressions: true

# ============================================================
# 6. CONDITION SYSTEM
# ============================================================

condition:
  allowedTypes:
    - state_equals
    - route_match
    - compare
    - and
    - or
    - not

  requiredByType:
    state_equals: [scope, key, equals]
    route_match: [routeId]
    compare: [left, op, right]
    and: [conditions]
    or: [conditions]
    not: [condition]

  scopeValues:
    - page
    - app

  compareOperators:
    - eq
    - ne
    - gt
    - gte
    - lt
    - lte

# ============================================================
# 7. NODE MODEL
# ============================================================

node:
  required:
    - id
    - component OR use OR injectable

  allowedFields:
    - id
    - component
    - use
    - injectable
    - props
    - role
    - layout
    - size
    - gridItem
    - position        # for absolute layout children only
    - visibility
    - accessibility
    - binding
    - interaction
    - selection
    - stateBindings
    - surface
    - elevation
    - children
    - pane
    - wireframeStyle

# 7.x POSITION (for absolute layout children)
position:
  fields:
    - top            # number (px)
    - left           # number (px)
    - right          # number (px)
    - bottom         # number (px)
  rules:
    - only valid on children of a node with layout.type: absolute
    - at least one of top/left/right/bottom should be specified

# 7.1 SIZE
size:
  fields:
    - width          # number or responsive string
    - height         # number or responsive string
    - minWidth       # number
    - maxWidth       # number
    - minHeight      # number
    - maxHeight      # number

# 7.2 GRID ITEM
gridItem:
  fields:
    - span           # integer, columns to span
    - offset         # integer, column offset
    - row            # integer, explicit row
    - column         # integer, explicit column

# 7.3 VISIBILITY
visibility:
  required:
    - condition      # Condition object

# 7.4 ACCESSIBILITY
accessibility:
  fields:
    - label          # accessible label
    - role           # semantic role
    - description    # longer description

# 7.5 BINDING (DATA SOURCE)
binding:
  required:
    - source         # Expression (e.g. {{item.field}}) or dataSource ID for collections
  optional:
    - itemVar        # variable name for collection items (required for collection binding)

# 7.6 SELECTION
selection:
  required:
    - scope          # page | app
    - stateKey       # StateKey
  optional:
    - selectable     # boolean

# 7.7 STATE BINDINGS
stateBindings:
  description: >
    Map of property names to Expression values.
    Keys are property names, values are {{state.x}} expressions.

# ============================================================
# 8. PRIMITIVE COMPONENTS
# ============================================================

primitives:
  containers:
    - section         # title, description
    - card            # title, description, media, footer
    - stack           # gap, padding, align
    - row             # gap, padding, align, justify, wrap, nowrap
    - grid            # columns, gap, minItemWidth
    - split           # gap, orientation (row|stack)
    - form            # title, submit, columns
    - carousel        # dots, arrows, items
  text:
    - heading         # text, label, level
    - paragraph       # text, label, lines
    - text            # text, label, variant (body|meta|label|caption|mono)
    - code            # text, language, inline
    - badge           # text, variant (neutral|outline|dot|pill), tone (neutral|info|success|warning|danger), icon
    - avatar          # name, src, size (xs|sm|md|lg|xl), shape (circle|square), group, overflow
    - icon            # name, style (solid|regular|brands), size
    - image           # src, alt, kind (image|video|map|embed|logo), ratio, width, height
    - rating          # value, max, count
    - stat            # label, value, delta, trend (up|down|flat), icon, sparkline
    - progress        # value, kind (bar|circle|spinner), label, indeterminate
    - skeleton        # lines, avatar, width
    - divider         # label, orientation (horizontal|vertical)
    - spacer          # size
    - empty_state     # title, text, icon, action, variant (empty|error|404|offline)
  controls:
    - button          # label, icon, iconStyle (solid|regular|brands), iconSize, variant (primary|secondary|ghost|danger|link), size (sm|md|lg), iconOnly, loading, disabled, fab
    - segmented       # options, value, size (sm|md|lg)
    - input           # label, placeholder, inputType (text|password|email|number|search|tel|url|date|time|datetime|color|range|otp|stepper), value, prefix, suffix, help, error, required, disabled, length
    - textarea        # label, placeholder, rows, help, error, required, disabled, maxLength
    - select          # label, placeholder, options, searchable, multiple, help, error, required, disabled
    - checkbox        # label, checked, description, disabled
    - radio           # label, checked, description, disabled
    - toggle          # label, checked, description, disabled
    - choice_group    # label, kind (checkbox|radio), options, value, inline
    - tags_input      # label, tags, placeholder
    - upload          # label, hint, files, variant (dropzone|button)
    - picker          # label, options, value, columns
    - editor          # label, toolbar, rows
  navigation:
    - tab_bar         # tabs, variant (underline|pill|enclosed)
    - bottom_tab_bar  # tabs
    - breadcrumb      # items, separator
    - pagination      # page, pages, variant (numbers|simple|dots)
    - stepper         # steps, current, orientation (row|stack)
    - nav             # items, collapsed, groups
    - menu            # items
    - app_bar         # title, subtitle, leading, actions
    - action_sheet    # items, title, cancel
    - page_header     # title, subtitle, breadcrumb, actions, tabs
  data:
    - table           # columns, rows, caption, selectable, state (default|loading|empty), emptyText, dense, pagination
    - list            # items, kind (plain|avatar|action|file|chat|timeline|settings), divided, selectable, refreshable
    - chart           # chartType (bar|vertical|horizontal|line|area|pie|donut|gauge|sparkline|heatmap), title, label, data, series, legend, axes, height
    - calendar        # view (month|week|day|picker), date, events
    - kanban          # columns
    - tree            # items, expanded
    - accordion       # items
  feedback:
    - alert           # text, title, variant (info|success|warning|error|neutral), icon, dismissible, inline

# Frame class per element: S always, C decided by the frame rules,
# N never, E one divider edge. See docs/cli/schema.md section 4.2.
frameClass:
  section: C
  card: S
  stack: N
  row: N
  grid: N
  split: N
  form: N
  carousel: C
  heading: N
  paragraph: N
  text: N
  code: S
  badge: N
  avatar: N
  icon: N
  image: N
  rating: N
  stat: C
  progress: N
  skeleton: N
  divider: E
  spacer: N
  empty_state: C
  button: N
  segmented: N
  input: N
  textarea: N
  select: N
  checkbox: N
  radio: N
  toggle: N
  choice_group: N
  tags_input: N
  upload: S
  picker: S
  editor: S
  tab_bar: E
  bottom_tab_bar: E
  breadcrumb: N
  pagination: N
  stepper: N
  nav: N
  menu: N
  app_bar: E
  action_sheet: N
  page_header: N
  table: C
  list: C
  chart: C
  calendar: S
  kanban: N
  tree: C
  accordion: C
  alert: S

aliases:
  chip: badge
  tag: badge
  pill: badge
  media: image
  kpi: stat
  metric: stat
  spinner: progress
  loader: progress
  combobox: select
  autocomplete: select
  switch: toggle
  tabs: tab_bar
  wizard: stepper
  sidenav: nav
  date_picker: calendar
  board: kanban
  banner: alert
  callout: alert

# Semantic roles that drive built-in proportions.
roles:
  - header
  - app_bar
  - sidebar
  - nav
  - main
  - aside
  - footer
  - toolbar
  - tabbar
  - form
  - dialog
  - sheet
  - drawer
  - content

# manifest.sizing accepts any of these, as a flat token-to-pixels map.
sizingTokens:
  - sidebar.width
  - sidebar.collapsedWidth
  - sidebar.minWidth
  - aside.width
  - header.height
  - tabbar.height
  - footer.minHeight
  - page.gutter
  - content.narrowWidth
  - card.padding
  - card.gap
  - grid.gap
  - control.height
  - control.minWidth
  - row.height
  - modal.width
  - drawer.width
  - sheet.maxHeight
  - chart.height
  - stat.minHeight
  - statusbar.height
  - homeindicator.height

layout:
  types:
    - stack
    - row
    - grid
    - absolute
    - overlay

  fields:
    - gap
    - padding
    - columns        # for grid
    - justify        # enum: flex-start|flex-end|center|space-between|space-around|space-evenly|stretch|start|end
    - align          # enum: flex-start|flex-end|center|stretch|baseline|start|end
    - separatorPolicy # auto | gutters | divide | none (auto/divide only matter when gap=0)
    - separators     # none | between (draw dividers between siblings; only meaningful when gap=0)
    - separatorStyle # solid | dashed (defaults to solid)

  grid:
    defaultColumns: 12
    rules:
      - span must not exceed column count
      - span cannot coexist with explicit width

  separatorRules:
    - if gap > 0, gutters act as separator; separators field is ignored
    - separatorPolicy:auto resolves to parent dividers only when gap == 0
    - separatorPolicy:gutters forces space-only separation
    - separatorPolicy:divide forces parent dividers when gap == 0
    - separatorPolicy:none forces truly flush adjacency
    - if gap == 0 and separators == "between", parent dividers are rendered (one line between siblings)
    - if gap == 0 and separators == "none", siblings are truly flush (no separator)

# ============================================================
# 9.1 VIEWPORT
# ============================================================

viewport:
  device:
    values:
      - mobile
      - tablet
      - web
  orientation:
    values:
      - portrait
      - landscape
    requiredFor:
      - mobile
      - tablet
    ignoredFor:
      - web

# ============================================================
# 10. RESPONSIVE CONTEXT
# ============================================================

responsive:
  contextsDeclaredIn: sitemap.yaml
  allowedOverrides:
    - width
    - height
    - span
    - gap
    - padding
    - columns
    - align
    - visibility

# ============================================================
# 10.1 INTERACTION MODEL
# ============================================================

interaction:
  types:
    - navigation
    - open_overlay
    - close_overlay
    - toggle
    - set_state
    - submit
    - action
    - gesture

  requiredByType:
    navigation: [targetRoute]
    open_overlay: [targetOverlay]
    close_overlay: [targetOverlay]
    toggle: [scope, stateKey]
    set_state: [scope, stateKey, value]
    submit: [formId]          # formId references a node ID acting as form container
    action: [actionId]
    gesture: [gestureType]

  gestureTypes:
    - swipe_left
    - swipe_right
    - swipe_up
    - swipe_down
    - long_press
    - pinch
    - double_tap

  gestureRules:
    - gestures are only active on mobile and tablet viewports
    - gestures are ignored on web viewport

  optionalOnAll:
    - condition

  noRawJavascript: true

# ============================================================
# 11. OVERLAY SYSTEM
# ============================================================

overlay:
  types:
    - dropdown
    - popover
    - menu
    - modal
    - drawer_left
    - drawer_right
    - bottom_sheet
    - toast
    - alert
    - tooltip

  layeringOrder:
    - base
    - overlay
    - modal
    - toast

  required:
    - id
    - type
    - content

  optional:
    - trigger
    - placement
    - dismissOn
    - wireframeStyle

  triggerRequires:
    appliesTo: [dropdown, popover, menu, tooltip]
    required:
      - trigger
      - placement

  dismissOptions:
    - backdrop
    - escape
    - button
    - timeout
    - outside

  placementValues:
    - top
    - bottom
    - left
    - right
    - center

  definedIn:
    - page.overlays       # page-specific overlays
    - template.overlays   # persistent overlays shared across pages

  inheritFromPageStyle: true

  rules:
    - template overlays are available on every page using that template
    - overlay IDs must be unique across template + page overlays for a given page

# ============================================================
# 12. PANE SYSTEM (RESIZABLE PANELS)
# ============================================================

pane:
  required:
    - resizable
    - collapsible
  # state is optional; required only if pane needs to persist size/collapsed state

  fields:
    - side
    - defaultSize
    - minSize
    - maxSize
    - collapsedSize
    - state:
        - scope
        - sizeKey
        - collapsedKey

# ============================================================
# 13. WIREFRAME STYLE SYSTEM
# ============================================================

wireframeStyle:
  requiredOnPage:
    - border.style

  border:
    style:
      values:
        - solid
        - dashed
      nonInheritable: true
    width:
      values:
        - thin
        - medium

  corner:
    style:
      values:
        - sharp
        - rounded
    radius: number

  override:
    description: >
      Per-node and per-overlay overrides use a partial style.
      No fields required — inherits from page wireframe style.
      Only specify properties being overridden.

# ============================================================
# 14. DATASET MODEL
# ============================================================

dataset:
  required:
    - dataset.id
    - dataset.primaryKey
    - dataset.items

  optional:
    - dataset.fields      # array of expected field names (informational)

  itemFormat:
    description: >
      Items are plain key-value objects passed and stored as whole objects.
      No field-by-field construction. Supported value types: string,
      number, boolean, array, nested object.

  rules:
    - primaryKey must exist in every item
    - no duplicate primaryKey values
    - no index-based referencing
    - items are addressed by primaryKey value only

# ============================================================
# 15. TEMPLATE MODEL
# ============================================================

template:
  required:
    - id
    - layout
    - regions

  documentOptional:
    - imports

  region:
    required:
      - id
      - kind
    kindValues:
      - persistent
      - slot
    optional:
      - sticky      # top | bottom — position: sticky on top-level regions only
      - component
      - use
      - layout
      - size        # width/height for sidebar-style regions
      - pane
      - children

  pageShell:
    description: >
      The rendered page is a flex column with min-height = device viewport height.
      The browser window is the scroll container — never an inner div.
      align-items: stretch on the body row ensures sidebars fill full height.
    stickyRule:
      - sticky: top renders as position: sticky; top: 0; z-index: 10
      - sticky: bottom renders as position: sticky; bottom: 0; z-index: 10
      - only valid on top-level template regions (direct children of template root)

  injectable:
    description: >
      A node within a persistent region marked injectable: true.
      Pages supply content for it via the injectables section.
    nodeField: "injectable: true"

  optional:
    - overlays          # array of Overlay objects (e.g. nav dropdowns, notification panels)

  rules:
    - page cannot override persistent regions
    - page must fill only declared slots
    - page may supply content for injectable nodes via injectables section
    - injectable IDs referenced by page must exist in template
    - template overlays are available on every page using that template
    - overlay IDs must be unique across template + page overlays
    - imported components are referenced with alias-qualified use values such as nav.primary_menu

# ============================================================
# 16. COMPONENT MODEL
# ============================================================

component:
  required:
    - id
    - root

  documentOptional:
    - imports

  optional:
    - propDefaults    # default prop values
    - propHints       # prop type/description hints

  rules:
    - all node IDs unique within component
    - no direct pageState references inside component
    - props referenced via {{props.key}}
    - {{props.key}} resolves during component expansion, including nested imported components
    - component documents may import other component documents from arbitrary project paths

# ============================================================
# 16.1 PAGE MODEL
# ============================================================

page:
  required:
    - id
    - template
    - viewport
    - wireframeStyle
    - slots

  documentOptional:
    - imports

  optional:
    - renderMode       # shorthand alias for rendering.mode
    - rendering        # { mode: line|card, density: comfortable|compact }
    - pageState
    - dataSources
    - actions
    - overlays
    - injectables

  dataSources:
    itemRequired:
      - id
      - dataset

  overlays:
    itemSchema: overlay   # uses overlay definition from section 11

# ============================================================
# 17. VALIDATION RULES
# ============================================================

validation:
  blockingErrors:
    - duplicate IDs
    - missing required page border.style
    - missing template reference
    - slot mismatch
    - missing injectable match
    - missing component reference
    - missing dataset reference
    - missing stateKey
    - invalid grid span
    - invalid overlay structure
    - circular template references
    - component recursion
    - tree depth exceeds limit
    - nodes per page exceeds limit
    - schema version incompatible
    - invalid targetRoute reference
    - invalid targetOverlay reference (checks page + template overlays)
    - invalid actionId reference
    - invalid formId reference

  warnings:
    - unused components
    - unused datasets
    - hidden interactive element
    - unreachable overlay
    - orphan routes
    - empty slots
    - naming convention violations
    - unknown primitive props

  info:
    - missing text on heading/paragraph/text
    - unlabeled input/select/textarea
    - text primitives using the label alias instead of canonical text
    - demoted nested surfaces with explicit width or height

  safetyLimits:
    maxTreeDepth: 100
    maxNodesPerPage: 5000

# ============================================================
# 18. EXPORT CONTRACT
# ============================================================

export:
  format: zip
  includes:
    - manifest.yaml
    - sitemap.yaml
    - templates.yaml
    - components.yaml
    - pages/
    - data/  # when present
    - assets/
    - additional imported component documents under the project root
  excludes:
    - .wfrc.yaml
  noTransformation: true

# ============================================================
# 19. BUILD CONTRACT
# ============================================================

build:
  outputDirectory: wireframes/build
  structure:
    - index.html              # master platform index
    - assets/                  # copied from project
    - "{platform}/"            # one folder per device type (web, mobile, tablet)
    -   index.html             # platform page index
    -   "{pageId}.html"        # one file per page
    -   _shared/
    -     wireframe.css        # shared wireframe styles
    -     interactions.js      # shared interaction runtime

  platformGrouping:
    source: page.viewport.device
    values:
      - web
      - mobile
      - tablet

  preconditions:
    - validation must pass
    - all references must resolve
    - schema version must be compatible

  rules:
    - no external dependencies in output
    - deterministic (same input = same output)
    - no timestamps or random values
    - .wfrc.yaml excluded from build
    - assets/ copied without transformation

  fullSpec: rendering.md

# ============================================================
# 20. DESIGN PRINCIPLES
# ============================================================

principles:
  - explicit_over_implicit
  - deterministic_structure
  - git_friendly
  - addressable_nodes
  - no_runtime_logic
  - no_hidden_state
  - schema_first_design
