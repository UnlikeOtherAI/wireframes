# ============================================================
# Wireframe Schema — Full Canonical YAML Definition
# Version: 1.1
# Purpose: Deterministic UI Architecture Specification
# ============================================================

schema:
  name: Wireframe Specification
  version: "1.1"
  description: >
    Deterministic declarative UI architecture format designed for
    template-based applications, reusable components, datasets,
    overlays, and strict validation. Git-native. Machine-readable.
    Export-safe. No runtime logic embedded.

# ============================================================
# 1. GLOBAL DOCUMENT CONTRACT
# ============================================================

document:
  requiredFields:
    - documentType
    - specVersion
    - id

  documentTypes:
    - manifest
    - sitemap
    - templates
    - components
    - page
    - dataset

  specVersionRequired: true

# ============================================================
# 2. PROJECT STRUCTURE
# ============================================================

projectStructure:
  root: /wireframe
  requiredFiles:
    - manifest.yaml
    - sitemap.yaml
    - templates.yaml
    - components.yaml
  optionalFiles:
    - .wfrc.yaml
  requiredFolders:
    - /pages
  optionalFolders:
    - /data
    - /assets
  notes:
    - additional documentType: components files may live anywhere under the project root
    - reusable component lookup is driven by explicit imports, not folder names

# ============================================================
# 3. ID RULES
# ============================================================

idRules:
  format: "^[a-z][a-z0-9_]*$"
  componentReferenceFormat: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"
  globalUniqueness:
    - route.id
    - template.id
    - component.id
    - page.id
    - dataset.id
  treeUniqueness:
    - node.id
    - overlay.id
  namingConventions:
    - snake_case only
    - no uppercase
    - no ambiguous names
    - no reserved keywords

documentImports:
  format: "{ alias: ./relative/path.yaml }"
  aliasFormat: "^[a-z][a-z0-9_]*$"
  validOn:
    - templates
    - components
    - page
  targetRule:
    - target file must be a valid documentType: components document
    - imports resolve relative to the importing document
    - import alias scope is local to the importing document
    - duplicate alias-qualified component IDs within one resolved page are invalid

# ============================================================
# 4. ADDRESSING MODEL
# ============================================================

addressing:
  canonicalFormat: "wf://<doctype>/<docid>#<path>"
  doctypeValues:
    - page
    - template
    - component
    - data
  path:
    separator: "."
    segments: "node ids only"
  datasetItem:
    format: "wf://data/<datasetId>#items:<primaryKey>=<value>"
  noIndexAddressing: true

# ============================================================
# 4.1 SITEMAP MODEL
# ============================================================

sitemap:
  required:
    - routes
  optional:
    - defaultTemplate
    - appState
    - contexts

  contexts:
    description: >
      Named responsive breakpoints. Keys are context names,
      values define minWidth/maxWidth ranges.

# ============================================================
# 5. STATE SYSTEM
# ============================================================

state:
  scopes:
    appState:
      location: sitemap.yaml
      persistsAcrossRoutes: true
    pageState:
      location: page.yaml
      resetsOnNavigation: true

  keyFormat: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"

  expressionFormat: >
    {{state.key}} |
    {{appState.key}} |
    {{route.id}} |
    {{event.field}} |
    {{props.key}} |
    {{item.field}}

  noFreeformExpressions: true

# ============================================================
# 6. CONDITION SYSTEM
# ============================================================

condition:
  allowedTypes:
    - state_equals
    - route_match
    - compare
    - and
    - or
    - not

  requiredByType:
    state_equals: [scope, key, equals]
    route_match: [routeId]
    compare: [left, op, right]
    and: [conditions]
    or: [conditions]
    not: [condition]

  scopeValues:
    - page
    - app

  compareOperators:
    - eq
    - ne
    - gt
    - gte
    - lt
    - lte

# ============================================================
# 7. NODE MODEL
# ============================================================

node:
  required:
    - id
    - component OR use OR injectable

  allowedFields:
    - id
    - component
    - use
    - injectable
    - props
    - role
    - layout
    - size
    - gridItem
    - scroll          # boolean; native overflow:auto, no resize handle
    - position        # for absolute layout children only
    - visibility
    - accessibility
    - binding
    - interaction
    - selection
    - stateBindings
    - surface
    - elevation
    - children        # on a use: node, fills the component's default slot
    - slots           # use: nodes only; slot name -> node array (SLOTS_WITHOUT_USE otherwise)
    - repeat          # { cell, items }: one row per keyed item, after children (see repeat below)
    - pane
    - wireframeStyle

# 7.0 SLOT PLACEHOLDER (fourth node-array entry kind; any object with a slot key)
slotPlaceholder:
  required:
    - id
    - slot            # slot name, Id pattern
  optional:
    - children        # fallback content
  additionalProperties: false
  allowedIn:
    - children below a component definition's root
    - another placeholder's fallback children
    - fills a component writes for its own nested instances (slots.<name>)
  notAllowed:
    - as a component root
    - in pages, templates or overlays

# 7.1 REPEAT (one cell, one row per keyed item; schema-systems.md 14.1)
repeat:
  required:
    - cell            # use: grammar; an element name or alias wins, else a component reference
    - items           # 0-200 maps; each has a unique id (Id pattern) plus the cell's props
  additionalProperties: false
  row: "{ id: <host id>__<item id>, component|use: <cell>, props: <item without id> }, after the host's children"
  hosts:
    - a component: node whose element lays out children (section, card, stack, row, grid, split, form, carousel, app_bar, tab_bar or bottom_tab_bar without tabs)
    - in region children, page slot and injection content, overlay content, definitions, slot fallbacks and fills
  notHosts:           # REPEAT_INVALID_HOST; the rows never render
    - use nodes, injectable markers and slot placeholders
    - template region records and overlay records
    - elements that do not lay out authored children
  expansion:
    - definition rows after the definition's props substitution, before namespacing and slot splicing
    - caller rows (page, template, fill) before the callee expands; forwarded fills keep page ids
    - ids are checked on the rendered page; a collision is DUPLICATE_NODE_ID at the item
    - one page expands to at most 50,000 nodes; a fan-out over it is REPEAT_BUDGET_EXCEEDED at the outermost repeat
    - instance children replace a slotless root's rows; a replaced slot fallback makes no rows
  example:
    - id: team
      component: grid
      layout: { type: grid, columns: 3 }
      repeat:
        cell: person_card
        items:
          - { id: ada, name: Ada Lovelace, role: Admin }       # renders as team__ada
          - { id: grace, name: Grace Hopper, role: Editor }
    - id: kpis
      component: row
      repeat:
        cell: stat
        items:
          - { id: revenue, label: Revenue, value: $12.4k, delta: +8%, trend: up }
          - { id: users, label: Users, value: "1,204" }

# 7.x POSITION (for absolute layout children)
position:
  fields:
    - top            # number (px)
    - left           # number (px)
    - right          # number (px)
    - bottom         # number (px)
  rules:
    - only valid on children of a node with layout.type: absolute
    - at least one of top/left/right/bottom should be specified

# 7.1 SIZE
size:
  fields:
    - width          # number or responsive string
    - height         # number or responsive string
    - minWidth       # number
    - maxWidth       # number
    - minHeight      # number
    - maxHeight      # number

# 7.2 GRID ITEM
gridItem:
  fields:
    - span           # integer, columns to span
    - offset         # integer, column offset
    - row            # integer, explicit row
    - column         # integer, explicit column

# 7.3 VISIBILITY
visibility:
  required:
    - condition      # Condition object

# 7.4 ACCESSIBILITY
accessibility:
  fields:
    - label          # accessible label
    - role           # semantic role
    - description    # longer description

# 7.5 BINDING (DATA SOURCE)
binding:
  required:
    - source         # Expression (e.g. {{item.field}}) or dataSource ID for collections
  optional:
    - itemVar        # variable name for collection items (required for collection binding)

# 7.6 SELECTION
selection:
  required:
    - scope          # page | app
    - stateKey       # StateKey
  optional:
    - selectable     # boolean

# 7.7 STATE BINDINGS
stateBindings:
  description: >
    Map of property names to Expression values.
    Keys are property names, values are {{state.x}} expressions.

# ============================================================
# 8. PRIMITIVE COMPONENTS
# ============================================================

primitives:
  containers:
    - section         # title, description
    - card            # title, description, actions, media, footer
    - stack           # gap, padding, align
    - row             # gap, padding, align, justify, wrap, nowrap
    - grid            # columns, gap, minItemWidth
    - split           # gap, orientation (row|stack)
    - form            # title, submit, columns
    - carousel        # dots, arrows, items
  text:
    - heading         # text, label, level
    - paragraph       # text, label, lines
    - text            # text, label, variant (body|meta|label|caption|mono)
    - code            # text, language, inline
    - badge           # text, variant (neutral|outline|dot|pill), tone (neutral|info|success|warning|danger), icon
    - avatar          # name, src, size (xs|sm|md|lg|xl), shape (circle|square), group, overflow
    - icon            # name, style (solid|regular|brands), size
    - image           # src, alt, kind (image|video|map|embed|logo), ratio, width, height
    - rating          # value, max, count
    - stat            # label, value, delta, trend (up|down|flat), icon, sparkline
    - progress        # value, kind (bar|circle|spinner), label, indeterminate
    - skeleton        # lines, avatar, width
    - divider         # label, orientation (horizontal|vertical)
    - spacer          # size
    - empty_state     # title, text, icon, action, variant (empty|error|404|offline)
  controls:
    # "+ field" = the shared field props: label, help, error, required, disabled, readonly.
    - button          # label, icon, iconStyle (solid|regular|brands), iconSize, iconPosition (start|end|center), route, variant (primary|secondary|ghost|danger|link), size (sm|md|lg), iconOnly, loading, disabled, fab, pressed
    - toolbar         # items (items), size (sm|md|lg), orientation (row|stack), labels
    - segmented       # options (items), value, size (sm|md|lg) + field
    - input           # placeholder, inputType (text|password|email|number|search|tel|url|date|time|datetime|color|range|otp|stepper), value (two numbers on range), min, max, step, prefix, suffix, icon, iconStyle, iconPosition, variant (default|plain), length + field
    - textarea        # placeholder, rows, maxLength + field
    - select          # placeholder, options (items), value (a list with multiple), searchable, multiple + field
    - checkbox        # checked, indeterminate, description (help is its alias) + field
    - radio           # checked, description (help is its alias) + field
    - toggle          # checked, description (help is its alias) + field
    - choice_group    # kind (checkbox|radio), options (items), value (a list for checkbox), inline + field
    - tags_input      # tags, placeholder + field
    - upload          # label (action copy), fieldLabel, hint, files, variant (dropzone|button) + field
    - picker          # options (items), value, columns + field
    - editor          # toolbar, rows + field
  navigation:
    - tab_bar         # tabs, variant (underline|pill|enclosed)
    - bottom_tab_bar  # tabs
    - breadcrumb      # items, separator
    - pagination      # page, pages, variant (numbers|simple|dots)
    - stepper         # steps, current, orientation (row|stack)
    - nav             # items, collapsed, groups, open, variant: rail|sidebar|top (optional)
    - menu            # items
    - menubar         # items (menus with nested items), open
    - command         # placeholder, query, items, empty, footer
    - app_bar         # title, subtitle, leading (an icon name, or the id of a child to draw before the title), actions
    - action_sheet    # items, title, cancel
    - page_header     # title, subtitle, breadcrumb, actions, tabs
  data:
    - table           # columns, rows, caption, selectable, state (default|loading|empty), emptyText, dense, pagination
    - list            # items, kind (plain|avatar|action|file|chat|timeline|settings), divided, selectable, refreshable
    - chart           # chartType (bar|vertical|horizontal|line|area|pie|donut|gauge|sparkline|heatmap|gantt), title, label, data, ticks, series, legend, axes, height
                      # gantt: data [{ label, start, end, tone }], ticks [labels spaced evenly across the domain]
    - calendar        # view (month|week|day|picker), date, events
    - kanban          # columns
    - tree            # items (open unless expanded: false), expanded
    - accordion       # items (closed unless expanded: true)
  feedback:
    - alert           # text, title, variant (info|success|warning|error|neutral), icon, dismissible, inline, actions

# Frame class per element: S always, C decided by the frame rules,
# N never, E one divider edge, B its own bar edge at the top level only,
# T a box at the top level only. See docs/cli/schema.md section 4.2.
frameClass:
  section: C
  card: S
  stack: N
  row: N
  grid: N
  split: N
  form: N
  carousel: C
  heading: N
  paragraph: N
  text: N
  code: S
  badge: N
  avatar: N
  icon: N
  image: N
  rating: N
  stat: C
  progress: N
  skeleton: N
  divider: E
  spacer: N
  empty_state: C
  button: N
  toolbar: N
  segmented: N
  input: N
  textarea: N
  select: N
  checkbox: N
  radio: N
  toggle: N
  choice_group: N
  tags_input: N
  upload: S
  picker: S
  editor: S
  tab_bar: E
  bottom_tab_bar: E
  breadcrumb: N
  pagination: N
  stepper: N
  nav: B           # variant sidebar | rail | top; a nav without a variant is N
  menu: T
  menubar: B
  command: C
  app_bar: E
  action_sheet: N
  page_header: N
  table: C
  list: C
  chart: C
  calendar: S
  kanban: N
  tree: C
  accordion: C
  alert: S

aliases:
  chip: badge
  tag: badge
  pill: badge
  media: image
  kpi: stat
  metric: stat
  spinner: progress
  loader: progress
  combobox: select
  autocomplete: select
  switch: toggle
  tabs: tab_bar
  wizard: stepper
  sidenav: nav
  date_picker: calendar
  board: kanban
  banner: alert
  callout: alert

# Semantic roles that drive built-in proportions.
roles:
  - header
  - app_bar
  - sidebar
  - nav
  - main
  - aside
  - footer
  - toolbar
  - tabbar
  - form
  - dialog
  - sheet
  - drawer
  - content

# manifest.sizing accepts any of these, as a flat token-to-pixels map.
sizingTokens:
  - sidebar.width
  - sidebar.collapsedWidth
  - sidebar.minWidth
  - aside.width
  - header.height
  - tabbar.height
  - footer.minHeight
  - page.gutter
  - content.narrowWidth
  - card.padding
  - card.gap
  - grid.gap
  - grid.minItemWidth   # web 220, tablet 200, mobile 150: the narrowest auto tile
  - control.height
  - control.minWidth
  - row.height
  - modal.width
  - drawer.width
  - sheet.maxHeight
  - chart.height
  - stat.minHeight
  - statusbar.height
  - homeindicator.height

layout:
  types:
    - stack
    - row
    - grid
    - absolute
    - overlay

  fields:
    - gap
    - padding
    - columns        # for grid
    - justify        # enum: flex-start|flex-end|center|space-between|space-around|space-evenly|stretch|start|end
    - align          # enum: flex-start|flex-end|center|stretch|baseline|start|end
    - separatorPolicy # auto | gutters | divide | none (auto/divide only matter when gap=0)
    - separators     # none | between (draw dividers between siblings; only meaningful when gap=0)
    - separatorStyle # solid | dashed (defaults to solid)

  grid:
    # Tracks, decided once for every grid host and for adaptive mode:
    #   1. a child placed with gridItem (span, offset, row, column): columns, else
    #      manifest.defaultGridColumns, else 12. Adaptive mode never reflows it.
    #   2. minItemWidth: tiles of at least that width.
    #   3. adaptive mode: tiles at the shown device's grid.minItemWidth.
    #   4. columns, then an explicit manifest.defaultGridColumns.
    #   5. otherwise tiles at grid.minItemWidth that fill the row and wrap.
    # Every track is minmax(0,1fr), and a tile minimum never exceeds the container.
    placementColumns: 12
    rules:
      - span must not exceed column count
      - span cannot coexist with explicit width

  separatorRules:
    - if gap > 0, gutters act as separator; separators field is ignored
    - separatorPolicy:auto resolves to parent dividers only when gap == 0
    - separatorPolicy:gutters forces space-only separation
    - separatorPolicy:divide forces parent dividers when gap == 0
    - separatorPolicy:none forces truly flush adjacency
    - if gap == 0 and separators == "between", parent dividers are rendered (one line between siblings)
    - if gap == 0 and separators == "none", siblings are truly flush (no separator)

# ============================================================
# 9.1 VIEWPORT
# ============================================================

viewport:
  device:
    values:
      - mobile
      - tablet
      - web
  orientation:
    values:
      - portrait
      - landscape
    requiredFor:
      - mobile
      - tablet
    ignoredFor:
      - web

# ============================================================
# 10. RESPONSIVE CONTEXT
# ============================================================

responsive:
  contextsDeclaredIn: sitemap.yaml
  allowedOverrides:
    - width
    - height
    - span
    - gap
    - padding
    - columns
    - align
    - visibility

# ============================================================
# 10.1 INTERACTION MODEL
# ============================================================

interaction:
  types:
    - navigation
    - open_overlay
    - close_overlay
    - toggle
    - set_state
    - submit
    - action
    - gesture

  requiredByType:
    navigation: [targetRoute]
    open_overlay: [targetOverlay]
    close_overlay: [targetOverlay]
    toggle: [scope, stateKey]
    set_state: [scope, stateKey, value]
    submit: [formId]          # formId references a node ID acting as form container
    action: [actionId]
    gesture: [gestureType]

  gestureTypes:
    - swipe_left
    - swipe_right
    - swipe_up
    - swipe_down
    - long_press
    - pinch
    - double_tap

  gestureRules:
    - gestures are only active on mobile and tablet viewports
    - gestures are ignored on web viewport

  optionalOnAll:
    - condition

  noRawJavascript: true

# ============================================================
# 11. OVERLAY SYSTEM
# ============================================================

overlay:
  types:
    - dropdown
    - popover
    - menu
    - modal
    - drawer_left
    - drawer_right
    - bottom_sheet
    - toast
    - alert
    - tooltip

  layeringOrder:
    - base
    - overlay
    - modal
    - toast

  required:
    - id
    - type
    - content

  optional:
    - trigger
    - placement
    - dismissOn
    - wireframeStyle
    - props:
        - title
        - actions        # [{ label, variant (primary|secondary|ghost|danger|link), route, disabled, tone (neutral|info|success|warning|danger) }]; other keys rejected

  triggerRequires:
    appliesTo: [dropdown, popover, menu, tooltip]
    required:
      - trigger
      - placement

  dismissOptions:
    - backdrop
    - escape
    - button
    - timeout
    - outside

  placementValues:
    - top
    - bottom
    - left
    - right
    - center

  definedIn:
    - page.overlays       # page-specific overlays
    - template.overlays   # persistent overlays shared across pages

  inheritFromPageStyle: true

  rules:
    - template overlays are available on every page using that template
    - overlay IDs must be unique across template + page overlays for a given page

# ============================================================
# 12. PANE SYSTEM (RESIZABLE PANELS)
# ============================================================

pane:
  required:
    - resizable
    - collapsible
  # state is optional; required only if pane needs to persist size/collapsed state

  fields:
    - side
    - defaultSize
    - minSize
    - maxSize
    - collapsedSize
    - state:
        - scope
        - sizeKey
        - collapsedKey

# ============================================================
# 13. WIREFRAME STYLE SYSTEM
# ============================================================

wireframeStyle:
  requiredOnPage:
    - border.style

  border:
    style:
      values:
        - solid
        - dashed
      nonInheritable: true
    width:
      values:
        - thin
        - medium

  corner:
    style:
      values:
        - sharp
        - rounded
    radius: number

  override:
    description: >
      Per-node and per-overlay overrides use a partial style.
      No fields required — inherits from page wireframe style.
      Only specify properties being overridden.

# ============================================================
# 14. DATASET MODEL
# ============================================================

dataset:
  required:
    - dataset.id
    - dataset.primaryKey
    - dataset.items

  optional:
    - dataset.fields      # array of expected field names (informational)

  itemFormat:
    description: >
      Items are plain key-value objects passed and stored as whole objects.
      No field-by-field construction. Supported value types: string,
      number, boolean, array, nested object.

  rules:
    - primaryKey must exist in every item
    - no duplicate primaryKey values
    - no index-based referencing
    - items are addressed by primaryKey value only

# ============================================================
# 15. TEMPLATE MODEL
# ============================================================

template:
  required:
    - id
    - layout
    - regions

  documentOptional:
    - imports

  region:
    required:
      - id
      - kind
    kindValues:
      - persistent
      - slot
    optional:
      - sticky      # top | bottom — position: sticky on top-level regions only
      - component
      - use
      - layout
      - size        # width/height for sidebar-style regions
      - pane
      - children

  pageShell:
    description: >
      The rendered page is a flex column with min-height = device viewport height.
      The browser window is the scroll container — never an inner div.
      align-items: stretch on the body row ensures sidebars fill full height.
    stickyRule:
      - "sticky: top renders as position: sticky; top: 0; z-index: 10"
      - "sticky: bottom renders as position: sticky; bottom: 0; z-index: 10"
      - only valid on top-level template regions (direct children of template root)

  injectable:
    description: >
      A node within a persistent region marked injectable: true.
      Pages supply content for it via the injectables section.
    nodeField: "injectable: true"

  optional:
    - overlays          # array of Overlay objects (e.g. nav dropdowns, notification panels)

  rules:
    - page cannot override persistent regions
    - page must fill only declared slots
    - page may supply content for injectable nodes via injectables section
    - injectable IDs referenced by page must exist in template
    - template overlays are available on every page using that template
    - overlay IDs must be unique across template + page overlays
    - imported components are referenced with alias-qualified use values such as nav.primary_menu

# ============================================================
# 16. COMPONENT MODEL
# ============================================================

component:
  required:
    - id
    - root

  documentOptional:
    - imports

  optional:
    - propDefaults    # default prop values
    - propHints       # prop type/description hints

  rules:
    - all node IDs unique within component
    - no direct pageState references inside component
    - props referenced via {{props.key}}
    - '{{props.key}} resolves during component expansion, including nested imported components'
    - a root prop written as its own token takes the instance value, else propDefaults
    - component documents may import other component documents from arbitrary project paths

  builtins:
    - std.<name> resolves to a built-in pattern (docs/cli/stdlib.md) when the project defines no component with that id
    - the project's own definitions win, including components imported under a std alias (STD_ALIAS_SHADOWED, info)
    - built-ins never join the project registry, so component listings and UNUSED_COMPONENT ignore them
    - built-ins are read-only; wf component copy std.<name> copies one into the project

  slots:
    fillRules:
      - instance children fill the default slot
      - slots.<name> fills a named slot
      - children plus slots.default is an error (DUPLICATE_DEFAULT_SLOT_FILL)
      - an omitted fill uses the placeholder's fallback children
      - an explicit [] leaves the slot empty, with no fallback and no diagnostic
      - neither content nor fallback reports EMPTY_COMPONENT_SLOT (info)
      - a component with no placeholders keeps the override path (instance children replace root children)
    scopeByAuthor:
      - the definition's own tree (root, internals, fallbacks, fills for its nested instances) is prepared in its scope
      - preparation is props substitution, import qualification, and ids and formIds namespaced under the instance
      - fill content is prepared by its caller; page fills keep page ids and get no substitution
      - prepared fills are spliced in place of the placeholder untouched; nested use expands after splicing
      - a caller-authored instance of the same component inside a fill is finite nesting
      - only definition cycles are errors; ids must be unique in the final resolved tree

  example:
    components:
      panel:
        propDefaults: { title: Details }
        root:
          id: panel
          component: card
          props: { title: "{{props.title}}" }
          children:
            - { id: body, slot: default }
            - id: footer
              slot: footer
              children:
                - { id: close, component: button, props: { label: Close } }
      checkout:                                  # forwards its own slots into panel
        root:
          id: checkout
          component: stack
          children:
            - id: pay_form
              component: stack
              children:
                - { id: card_number, component: input, props: { label: Card number } }
            - id: pay_panel
              use: panel
              props: { title: Checkout }
              children:
                - { id: checkout_body, slot: default }
              slots:
                footer:
                  - id: pay
                    component: button
                    props: { label: Pay }
                    interaction: [{ type: submit, formId: pay_form }]   # becomes <instance>__pay_form
                  - { id: checkout_actions, slot: actions }
    instance:
      - id: billing_panel
        use: panel
        props: { title: Billing }
        children:                                # fills default
          - { id: plan_name, component: heading, props: { text: Pro plan } }
        slots:
          footer:
            - { id: upgrade, component: button, props: { label: Upgrade, variant: primary } }
      - id: order
        use: checkout
        children:
          - { id: order_summary, component: text, props: { text: Two items } }
        slots:
          actions: []                            # intentionally empty

# ============================================================
# 16.1 PAGE MODEL
# ============================================================

page:
  required:
    - id
    - template
    - viewport
    - wireframeStyle
    - slots

  documentOptional:
    - imports

  optional:
    - renderMode       # shorthand alias for rendering.mode
    - rendering        # { mode: line|card, density: comfortable|compact }
    - pageState
    - dataSources
    - actions
    - overlays
    - injectables

  dataSources:
    itemRequired:
      - id
      - dataset

  overlays:
    itemSchema: overlay   # uses overlay definition from section 11

# ============================================================
# 17. VALIDATION RULES
# ============================================================

validation:
  blockingErrors:
    - duplicate IDs
    - missing required page border.style
    - missing template reference
    - slot mismatch
    - missing injectable match
    - missing component reference
    - missing dataset reference
    - missing stateKey
    - invalid grid span
    - invalid overlay structure
    - circular template references
    - component recursion
    - tree depth exceeds limit
    - nodes per page exceeds limit
    - schema version incompatible
    - invalid targetRoute reference
    - invalid targetOverlay reference (checks page + template overlays)
    - invalid actionId reference
    - invalid formId reference
    - unknown component slot (UNKNOWN_COMPONENT_SLOT, lists valid slots)
    - duplicate component slot (DUPLICATE_COMPONENT_SLOT)
    - children plus slots.default (DUPLICATE_DEFAULT_SLOT_FILL)
    - slot placeholder as a component root or outside a component (SLOT_OUTSIDE_COMPONENT)
    - slots on a node without use (SLOTS_WITHOUT_USE)
    - repeat cell that is neither an element nor a component (UNKNOWN_REPEAT_CELL, suggests the nearest)
    - repeat on a node or record that cannot host rows (REPEAT_INVALID_HOST)
    - two repeat items with one id (DUPLICATE_REPEAT_ITEM_ID)
    - repeat with a collection binding on, above or in its cell, also across a component boundary (REPEAT_WITH_BINDING)
    - repeat fan-out over the page budget (REPEAT_BUDGET_EXCEEDED)
    - repeat row that cannot be expanded, at its item (REPEAT_ROW_FAILED)

  warnings:
    - unused components
    - unused datasets
    - hidden interactive element
    - unreachable overlay
    - orphan routes
    - empty slots
    - naming convention violations
    - unknown primitive props

  info:
    - missing text on heading/paragraph/text
    - unlabeled input/select/textarea
    - text primitives using the label alias instead of canonical text
    - demoted nested surfaces with explicit width or height
    - component slot with neither content nor fallback (EMPTY_COMPONENT_SLOT)
    - a std import alias shadowing built-in std patterns (STD_ALIAS_SHADOWED)
    - a repeat with no items (EMPTY_REPEAT)
    - an {{item.}} token in a repeat item, which is not interpreted (REPEAT_ITEM_TOKEN)

  safetyLimits:
    maxTreeDepth: 100
    maxNodesPerPage: 5000

# ============================================================
# 18. EXPORT CONTRACT
# ============================================================

export:
  format: zip
  includes:
    - manifest.yaml
    - sitemap.yaml
    - templates.yaml
    - components.yaml
    - pages/
    - data/  # when present
    - assets/
    - additional imported component documents under the project root
  excludes:
    - .wfrc.yaml
  noTransformation: true

# ============================================================
# 19. BUILD CONTRACT
# ============================================================

build:
  outputDirectory: wireframes/build
  structure:
    - index.html              # master platform index
    - assets/                  # copied from project
    - "{platform}/"            # one folder per device type (web, mobile, tablet)
    -   index.html             # platform page index
    -   "{pageId}.html"        # one file per page
    -   _shared/
    -     wireframe.css        # shared wireframe styles
    -     interactions.js      # shared interaction runtime

  platformGrouping:
    source: page.viewport.device
    values:
      - web
      - mobile
      - tablet

  preconditions:
    - validation must pass
    - all references must resolve
    - schema version must be compatible

  rules:
    - no external dependencies in output
    - deterministic (same input = same output)
    - no timestamps or random values
    - .wfrc.yaml excluded from build
    - assets/ copied without transformation

  fullSpec: rendering.md

# ============================================================
# 20. DESIGN PRINCIPLES
# ============================================================

principles:
  - explicit_over_implicit
  - deterministic_structure
  - git_friendly
  - addressable_nodes
  - no_runtime_logic
  - no_hidden_state
  - schema_first_design

# Additive presentation contract (spec 1.1).
presentationExtensions:
  buttonAndInput:
    icon: Font Awesome Free canonical name or alias
    iconStyle: [solid, regular, brands]
    iconPosition: [start, end, center]
  cornerStyle: [sharp, rounded, pill]
  nodeSticky: [top, bottom, none]
  imagePlaceholder:
    source: omit src
    description: alt is visible, wraps and supplies an accessible image name

# Named skins use a 1.2 manifest; other documents remain 1.1.
designSystemExtension:
  manifestSpecVersion: "1.2"
  manifestSchemaVersion: "1.2"
  ordinaryDocumentVersion: "1.1"
  containerFormat: wf/1
  path: manifest.designSystem
  fields:
    activeSkin: skin ID or reserved wireframe; defaults to wireframe
    skins: map of Id to Skin
  Skin:
    name: required non-empty display name
    defaults: optional SkinAppearance
    roles: map of canonical primitive or primitive.variant to SkinAppearance
    logos:
      keys: optional logo_1, logo_2, logo_3 only
      value:
        name: nonempty display name, maximum 80 characters
        src: static PNG data URL, decoded maximum 256 KiB, maximum 1024 pixels per side
  LogoImageProps:
    kind: logo
    slot: logo_1 or logo_2 or logo_3
    width: positive container points, maximum 4096
    height: positive container points, maximum 4096
  SkinAppearance:
    colors:
      text: "#RRGGBB"
      background: "#RRGGBB or transparent"
      border: "#RRGGBB"
      accent: "#RRGGBB"
    border: existing WireframeStyleOverride.border
    corner: existing WireframeStyleOverride.corner
  roleSource: engine/schema/primitive-registry
  selector: existing node.props.variant
  restrictions:
    - no custom roles or token references
    - colors occur only in skin appearances, never ordinary wireframeStyle
    - selected named skin must exist; wireframe cannot be overwritten
    - defaults and roles cannot override state-owned error/status cues implicitly

# Table columns with kind: link accept keyed or positional cells:
# {text: Device A, route: device_a}. route names an existing internal sitemap route.
# Scalar/unknown/unsafe link cells remain inert; pagination is illustrative.

# Optional page.inset: number, 0..4096 CSS pixels; 0 is full bleed.
# Omission keeps mode/platform defaults; not inherited from templates.
