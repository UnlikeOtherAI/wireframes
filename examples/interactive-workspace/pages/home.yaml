documentType: page
specVersion: "1.1"
id: home
page:
  id: home
  template: workspace
  viewport: { device: tablet, platform: ios, orientation: portrait }
  slots:
    - slotId: main
      content:
        - id: workspace_bar
          component: app_bar
          sticky: top
          props: { title: Studio workspace }
          children:
            - id: home_link
              component: button
              props: { label: Home, icon: house, variant: ghost, route: home }
            - id: library_link
              component: button
              props: { label: Library, icon: folder-open, variant: ghost, route: library }
            - id: account_button
              component: button
              props: { label: Ada, icon: circle-user, iconStyle: regular, iconPosition: end, variant: secondary }
              interaction: [{ type: open_overlay, targetOverlay: account_menu }]
        - id: dashboard_title
          component: page_header
          props: { title: Good afternoon, subtitle: Your projects and upcoming work }
        - id: workspace_columns
          component: grid
          props: { columns: 2, minItemWidth: 280 }
          children:
            - id: project_card
              component: card
              props: { title: Product launch }
              children:
                - id: project_image
                  component: image
                  props: { alt: "Product launch: a new reusable water bottle on a clean studio background", ratio: "16:9" }
                - id: project_description
                  component: paragraph
                  props: { text: "The launch site is ready for review. Check the asset library before sharing it with the team." }
                - id: open_library
                  component: button
                  props: { label: Review assets, icon: arrow-right, iconPosition: end, variant: primary, route: library }
                  wireframeStyle: { corner: { style: pill } }
            - id: quick_actions
              component: card
              props: { title: Find your next task }
              children:
                - id: search_projects
                  component: input
                  props: { label: Search projects, placeholder: "Project or person", inputType: search, icon: magnifying-glass, iconPosition: center }
                  wireframeStyle: { corner: { style: pill } }
                - id: email_field
                  component: input
                  props: { label: Email address, placeholder: "ada@example.com", icon: envelope, iconStyle: regular, iconPosition: start }
                - id: search_trailing
                  component: input
                  props: { label: Search by tag, placeholder: "Type a tag", icon: magnifying-glass, iconPosition: end }
                - id: github_action
                  component: button
                  props: { label: Open source library, icon: github, iconStyle: brands, variant: secondary, route: library }
        - id: composer_heading
          component: heading
          props: { text: Send a project note, level: 3 }
        - id: note_composer
          component: row
          layout: { type: row, gap: 8, padding: 6, align: center }
          wireframeStyle: { corner: { style: pill }, border: { style: solid, width: thin } }
          children:
            - id: discard_note
              component: button
              props: { label: Discard note, icon: xmark, iconPosition: center, variant: ghost, size: lg }
              wireframeStyle: { corner: { style: pill } }
            - id: note_text
              component: input
              size: { width: fill }
              props: { placeholder: "Write a project note", variant: plain }
              accessibility: { label: Project note }
            - id: stop_note
              component: button
              props: { label: Stop, icon: stop, iconPosition: center, variant: secondary, size: lg }
              wireframeStyle: { corner: { style: pill } }
            - id: send_note
              component: button
              props: { label: Send note, icon: arrow-up, iconPosition: center, variant: primary, size: lg, route: library }
              wireframeStyle: { corner: { style: pill } }
        - id: upcoming_heading
          component: heading
          props: { text: Upcoming reviews, level: 3 }
        - id: review_1
          component: card
          props: { title: "Brand direction · round 1" }
          children:
            - id: review_note_1
              component: paragraph
              props: { text: "Review the latest draft, record feedback, and open the asset library to inspect the supporting material." }
            - id: review_link_1
              component: button
              props: { label: Review details, icon: arrow-right, iconPosition: end, route: library }
