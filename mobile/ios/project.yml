name: Wireframes
options:
  bundleIdPrefix: com.unlikeotherai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 23B7GTLBN7
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Wireframes:
    type: application
    platform: iOS
    sources:
      - path: Wireframes
      - path: ../web/dist
        type: folder
        buildPhase: resources
        name: web
    dependencies:
      - framework: build/WfCore.xcframework
        embed: false
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.wireframes
        INFOPLIST_FILE: Wireframes/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WireframesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WireframesUITests
    dependencies:
      - target: Wireframes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.wireframes.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Wireframes
schemes:
  Wireframes:
    build:
      targets:
        Wireframes: all
        WireframesUITests: [test]
    test:
      targets:
        - WireframesUITests
