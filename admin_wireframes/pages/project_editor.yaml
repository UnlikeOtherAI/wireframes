documentType: page
specVersion: "1.1"
id: project_editor
page:
  id: project_editor
  template: app_template
  viewport:
    device: web
  wireframeStyle:
    border:
      style: solid

  pageState:
    build_status: idle
    message_sent: false
    workspace_mode: preview
    active_file: dashboard
    active_device: web
    active_orientation: portrait
  overlays:
    - id: history_modal
      type: modal
      content:
        - id: history_card
          component: section
          layout:
            type: stack
            gap: 16
            padding: 24
          size:
            width: 560
          children:
            - id: history_heading
              component: heading
              props:
                label: "Change History"
                level: 3
            - id: history_note
              component: paragraph
              props:
                label: "All changes to this project, including who made them and when."
            - id: history_table
              component: table
              props:
                columns:
                  - { key: time, label: "Time" }
                  - { key: user, label: "User" }
                  - { key: action, label: "Action" }
                  - { key: page, label: "Page" }
                rows:
                  - { time: "2 min ago", user: "You", action: "Added stats row", page: "dashboard" }
                  - { time: "15 min ago", user: "You", action: "Created page", page: "settings" }
                  - { time: "1 hour ago", user: "Alice Chen", action: "Updated heading", page: "dashboard" }
                  - { time: "2 hours ago", user: "You", action: "Added sidebar nav", page: "dashboard" }
                  - { time: "Yesterday", user: "Alice Chen", action: "Created page", page: "profile" }
            - id: history_close
              component: button
              props:
                label: "Close"
              interaction:
                - type: close_overlay
                  targetOverlay: history_modal
    - id: add_page_modal
      type: modal
      content:
        - id: add_page_card
          component: section
          layout:
            type: stack
            gap: 16
            padding: 24
          size:
            width: 420
          children:
            - id: add_page_heading
              component: heading
              props:
                label: "Add Page"
                level: 3
            - id: add_page_name
              component: input
              props:
                label: "Page Name"
                placeholder: "My New Page"
            - id: add_page_template
              component: select
              props:
                label: "Template"
                options:
                  - { value: main_template, label: "main_template" }
                  - { value: none, label: "No template" }
            - id: add_page_actions
              component: section
              layout:
                type: row
                gap: 8
                justify: flex-end
              children:
                - id: add_page_cancel
                  component: button
                  props:
                    label: "Cancel"
                  interaction:
                    - type: close_overlay
                      targetOverlay: add_page_modal
                - id: add_page_create
                  component: button
                  props:
                    label: "Create Page"
                    icon: plus
                  interaction:
                    - type: close_overlay
                      targetOverlay: add_page_modal
    - id: download_modal
      type: modal
      content:
        - id: dl_card
          component: section
          layout:
            type: stack
            gap: 16
            padding: 24
          size:
            width: 420
          children:
            - id: dl_heading
              component: heading
              props:
                label: "Download Project"
                level: 3
            - id: dl_note
              component: paragraph
              props:
                label: "Download the full project as a ZIP archive."
            - id: dl_source
              component: button
              props:
                label: "Source YAML"
                icon: file-zipper
              size:
                width: "100%"
              interaction:
                - type: close_overlay
                  targetOverlay: download_modal
            - id: dl_html
              component: button
              props:
                label: "Built HTML"
                icon: file-zipper
              size:
                width: "100%"
              interaction:
                - type: close_overlay
                  targetOverlay: download_modal
            - id: dl_screenshots
              component: button
              props:
                label: "Screenshots (PNG)"
                icon: image
              size:
                width: "100%"
              interaction:
                - type: close_overlay
                  targetOverlay: download_modal
            - id: dl_close
              component: button
              props:
                label: "Close"
              interaction:
                - type: close_overlay
                  targetOverlay: download_modal
  slots:
    - slotId: main_content
      content:
        - id: editor_layout
          component: section
          layout:
            type: row
            gap: 0
          size:
            height: "100%"
          children:
            # --- Project sidebar (navigation) ---
            - id: editor_sidebar
              component: section
              layout:
                type: stack
                gap: 4
                padding: 12
              size:
                width: 220
              children:
                - id: sb_project
                  component: heading
                  props:
                    label: "My App Wireframe"
                    level: 4
                - id: sb_search
                  component: input
                  props:
                    placeholder: "Search files..."
                  size:
                    width: "100%"
                - id: sb_pages_label
                  component: text
                  props:
                    label: "PAGES"
                - id: sb_page_1
                  component: button
                  props:
                    label: "dashboard"
                    icon: file
                  size:
                    width: "100%"
                  interaction:
                    - type: set_state
                      stateKey: active_file
                      value: dashboard
                      scope: page
                - id: sb_page_2
                  component: button
                  props:
                    label: "settings"
                    icon: file
                  size:
                    width: "100%"
                  interaction:
                    - type: set_state
                      stateKey: active_file
                      value: settings
                      scope: page
                - id: sb_page_3
                  component: button
                  props:
                    label: "profile"
                    icon: file
                  size:
                    width: "100%"
                  interaction:
                    - type: set_state
                      stateKey: active_file
                      value: profile
                      scope: page
                - id: sb_page_4
                  component: button
                  props:
                    label: "checkout"
                    icon: file
                  size:
                    width: "100%"
                  interaction:
                    - type: set_state
                      stateKey: active_file
                      value: checkout
                      scope: page
                - id: sb_add_page
                  component: button
                  props:
                    label: "Add Page"
                    icon: plus
                  size:
                    width: "100%"
                  interaction:
                    - type: open_overlay
                      targetOverlay: add_page_modal
                - id: sb_div1
                  component: divider
                - id: sb_tpl_label
                  component: text
                  props:
                    label: "TEMPLATES"
                - id: sb_tpl_1
                  component: button
                  props:
                    label: "main_template"
                    icon: layer-group
                  size:
                    width: "100%"
                  interaction:
                    - type: set_state
                      stateKey: active_file
                      value: main_template
                      scope: page
                - id: sb_div2
                  component: divider
                - id: sb_comp_label
                  component: text
                  props:
                    label: "COMPONENTS"
                - id: sb_comp_1
                  component: button
                  props:
                    label: "nav_item"
                    icon: cube
                  size:
                    width: "100%"
                  interaction:
                    - type: set_state
                      stateKey: active_file
                      value: nav_item
                      scope: page
                - id: sb_comp_2
                  component: button
                  props:
                    label: "card_widget"
                    icon: cube
                  size:
                    width: "100%"
                  interaction:
                    - type: set_state
                      stateKey: active_file
                      value: card_widget
                      scope: page
                - id: sb_spacer
                  component: spacer
                  size:
                    height: "100%"
                - id: sb_div3
                  component: divider
                - id: sb_nav_editor
                  component: button
                  props:
                    label: "Editor"
                    icon: code
                  size:
                    width: "100%"
                - id: sb_nav_settings
                  component: button
                  props:
                    label: "Settings"
                    icon: gear
                  size:
                    width: "100%"
                  interaction:
                    - type: navigation
                      targetRoute: project_settings
                - id: sb_nav_members
                  component: button
                  props:
                    label: "Members"
                    icon: users
                  size:
                    width: "100%"
                  interaction:
                    - type: navigation
                      targetRoute: project_members
                - id: sb_nav_preview
                  component: button
                  props:
                    label: "Preview & Share"
                    icon: share-nodes
                  size:
                    width: "100%"
                  interaction:
                    - type: navigation
                      targetRoute: project_preview
                - id: sb_nav_dashboard
                  component: button
                  props:
                    label: "Dashboard"
                    icon: arrow-left
                  size:
                    width: "100%"
                  interaction:
                    - type: navigation
                      targetRoute: dashboard

            # --- Main workspace ---
            - id: editor_main
              component: section
              layout:
                type: stack
                gap: 0
              size:
                width: "100%"
              children:
                # Toolbar
                - id: editor_toolbar
                  component: section
                  layout:
                    type: row
                    gap: 8
                    align: center
                    padding: 8
                  children:
                    - id: tb_page_icon
                      component: icon
                      props:
                        name: file
                        size: sm
                    - id: tb_page_name
                      component: heading
                      props:
                        label: "dashboard.yaml"
                        level: 3
                    - id: tb_status
                      component: section
                      layout:
                        type: row
                        gap: 4
                        align: center
                      children:
                        - id: tb_status_dot
                          component: icon
                          props:
                            name: circle-check
                            size: sm
                        - id: tb_status_text
                          component: text
                          props:
                            label: "Valid"
                    - id: tb_spacer
                      component: spacer
                      size:
                        width: "100%"
                    - id: tb_undo
                      component: button
                      props:
                        label: "Undo"
                        icon: rotate-left
                    - id: tb_redo
                      component: button
                      props:
                        label: "Redo"
                        icon: rotate-right
                    - id: tb_divider
                      component: text
                      props:
                        label: "|"
                    - id: tb_history
                      component: button
                      props:
                        label: "Change Log"
                        icon: clock-rotate-left
                      interaction:
                        - type: open_overlay
                          targetOverlay: history_modal
                    - id: tb_download
                      component: button
                      props:
                        label: "Download"
                        icon: download
                      interaction:
                        - type: open_overlay
                          targetOverlay: download_modal
                    - id: tb_build
                      component: button
                      props:
                        label: "Build"
                        icon: hammer
                      interaction:
                        - type: set_state
                          stateKey: build_status
                          value: building
                          scope: page
                    - id: tb_building_indicator
                      component: text
                      props:
                        label: "Building..."
                      visibility:
                        condition:
                          type: state_equals
                          scope: page
                          key: build_status
                          equals: building

                # Split: Chat + Workspace
                - id: editor_split
                  component: section
                  layout:
                    type: row
                    gap: 0
                  size:
                    height: "100%"
                  children:
                    # --- Chat panel (left) ---
                    - id: chat_panel
                      component: section
                      layout:
                        type: stack
                        gap: 0
                      size:
                        width: 400
                      children:
                        - id: chat_header
                          component: section
                          layout:
                            type: row
                            gap: 8
                            padding: 8
                            align: center
                          children:
                            - id: chat_header_icon
                              component: icon
                              props:
                                name: comments
                                size: sm
                            - id: chat_header_title
                              component: heading
                              props:
                                label: "Chat"
                                level: 4
                            - id: chat_header_spacer
                              component: spacer
                              size:
                                width: "100%"
                            - id: chat_context_badge
                              component: section
                              layout:
                                type: row
                                gap: 4
                                align: center
                              children:
                                - id: chat_ctx_icon
                                  component: icon
                                  props:
                                    name: location-dot
                                    size: sm
                                - id: chat_ctx_page
                                  component: text
                                  props:
                                    label: "dashboard.yaml"
                            - id: chat_history_btn
                              component: button
                              props:
                                label: "Change Log"
                                icon: clock-rotate-left
                              interaction:
                                - type: open_overlay
                                  targetOverlay: history_modal

                        - id: chat_messages
                          component: section
                          layout:
                            type: stack
                            gap: 12
                            padding: 12
                          size:
                            height: "100%"
                          children:
                            - id: msg_system
                              component: section
                              layout:
                                type: stack
                                gap: 4
                                padding: 8
                              children:
                                - id: msg_sys_label
                                  component: text
                                  props:
                                    label: "System"
                                - id: msg_sys_text
                                  component: paragraph
                                  props:
                                    label: "Project loaded. You are editing dashboard.yaml. Ask me to add components, modify layouts, or generate new pages."

                            - id: msg_user_1
                              component: section
                              layout:
                                type: stack
                                gap: 4
                                padding: 8
                              children:
                                - id: msg_u1_label
                                  component: text
                                  props:
                                    label: "You"
                                - id: msg_u1_text
                                  component: paragraph
                                  props:
                                    label: "Add a stats row with 4 metric cards at the top showing Users, Revenue, Orders, and Conversion Rate"

                            - id: msg_ai_1
                              component: section
                              layout:
                                type: stack
                                gap: 4
                                padding: 8
                              children:
                                - id: msg_a1_label
                                  component: text
                                  props:
                                    label: "Assistant"
                                - id: msg_a1_text
                                  component: paragraph
                                  props:
                                    label: "I've added a stats row with 4 metric cards to the top of dashboard.yaml. Each card shows an icon, the metric value, and a label. The preview has been updated."
                                - id: msg_a1_changes
                                  component: section
                                  layout:
                                    type: row
                                    gap: 4
                                    align: center
                                  children:
                                    - id: msg_a1_diff_icon
                                      component: icon
                                      props:
                                        name: code-compare
                                        size: sm
                                    - id: msg_a1_diff_text
                                      component: text
                                      props:
                                        label: "4 nodes added to dashboard.yaml"

                        - id: chat_input_area
                          component: section
                          layout:
                            type: row
                            gap: 8
                            padding: 8
                            align: center
                          children:
                            - id: chat_input
                              component: input
                              props:
                                placeholder: "Describe changes to the current page..."
                              size:
                                width: "100%"
                            - id: chat_send
                              component: button
                              props:
                                label: "Send"
                                icon: paper-plane
                              interaction:
                                - type: set_state
                                  stateKey: message_sent
                                  value: true
                                  scope: page

                    # --- Workspace iframe (right) ---
                    - id: workspace_panel
                      component: section
                      layout:
                        type: stack
                        gap: 0
                      size:
                        width: "100%"
                      children:
                        - id: ws_toolbar
                          component: section
                          layout:
                            type: row
                            gap: 8
                            padding: 8
                            align: center
                          children:
                            - id: ws_mode_tabs
                              component: tab_bar
                              children:
                                - id: ws_tab_preview
                                  component: button
                                  props:
                                    label: "Preview"
                                    icon: desktop
                                  interaction:
                                    - type: set_state
                                      stateKey: workspace_mode
                                      value: preview
                                      scope: page
                                - id: ws_tab_sitemap
                                  component: button
                                  props:
                                    label: "Sitemap"
                                    icon: sitemap
                                  interaction:
                                    - type: set_state
                                      stateKey: workspace_mode
                                      value: sitemap
                                      scope: page
                            - id: ws_spacer
                              component: spacer
                              size:
                                width: "100%"
                            - id: ws_device_web
                              component: button
                              props:
                                label: "Web"
                                icon: desktop
                              interaction:
                                - type: set_state
                                  stateKey: active_device
                                  value: web
                                  scope: page
                            - id: ws_device_tablet
                              component: button
                              props:
                                label: "Tablet"
                                icon: tablet
                              interaction:
                                - type: set_state
                                  stateKey: active_device
                                  value: tablet
                                  scope: page
                            - id: ws_device_mobile
                              component: button
                              props:
                                label: "Mobile"
                                icon: mobile
                              interaction:
                                - type: set_state
                                  stateKey: active_device
                                  value: mobile
                                  scope: page
                            - id: ws_orient_divider
                              component: text
                              props:
                                label: "|"
                            - id: ws_orient_portrait
                              component: button
                              props:
                                icon: mobile
                                label: "Portrait"
                              interaction:
                                - type: set_state
                                  stateKey: active_orientation
                                  value: portrait
                                  scope: page
                            - id: ws_orient_landscape
                              component: button
                              props:
                                icon: mobile
                                label: "Landscape"
                              interaction:
                                - type: set_state
                                  stateKey: active_orientation
                                  value: landscape
                                  scope: page
                            - id: ws_divider
                              component: text
                              props:
                                label: "|"
                            - id: ws_zoom
                              component: select
                              props:
                                placeholder: "100%"
                                options:
                                  - { value: "50", label: "50%" }
                                  - { value: "75", label: "75%" }
                                  - { value: "100", label: "100%" }
                                  - { value: "150", label: "150%" }
                            - id: ws_refresh
                              component: button
                              props:
                                label: "Refresh"
                                icon: arrows-rotate
                              interaction:
                                - type: set_state
                                  stateKey: build_status
                                  value: refreshing
                                  scope: page
                            - id: ws_popout
                              component: button
                              props:
                                label: "Open in Tab"
                                icon: up-right-from-square
                              interaction:
                                - type: navigation
                                  targetRoute: project_preview

                        - id: ws_viewport
                          component: section
                          visibility:
                            condition:
                              type: state_equals
                              scope: page
                              key: workspace_mode
                              equals: preview
                          layout:
                            type: stack
                            padding: 24
                            align: center
                          size:
                            height: "100%"
                          children:
                            - id: ws_frame
                              component: section
                              layout:
                                type: stack
                                padding: 16
                                gap: 16
                              children:
                                - id: ws_preview_heading
                                  component: heading
                                  props:
                                    label: "[Rendered wireframe preview]"
                                    level: 3
                                - id: ws_preview_note
                                  component: paragraph
                                  props:
                                    label: "The workspace shows a live, interactive preview of the current page. Click through navigation links to move between pages. The chat panel tracks which page you are viewing."
                                - id: ws_preview_hint
                                  component: text
                                  props:
                                    label: "Use the chat to describe changes. Generation happens automatically."

                        # --- Sitemap tree view (shown when workspace_mode = sitemap) ---
                        - id: ws_sitemap
                          component: section
                          visibility:
                            condition:
                              type: state_equals
                              scope: page
                              key: workspace_mode
                              equals: sitemap
                          layout:
                            type: stack
                            padding: 16
                            gap: 4
                          size:
                            height: "100%"
                          children:
                            - id: sm_heading
                              component: heading
                              props:
                                label: "Project Sitemap"
                                level: 3
                            - id: sm_note
                              component: text
                              props:
                                label: "Click any page to open it in the preview. The chat context updates automatically."
                            - id: sm_divider
                              component: divider
                            # Pages folder
                            - id: sm_pages_folder
                              component: section
                              layout:
                                type: stack
                                gap: 2
                                padding: 0
                              children:
                                - id: sm_pages_label
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                  children:
                                    - id: sm_pages_icon
                                      component: icon
                                      props:
                                        name: folder-open
                                        size: sm
                                    - id: sm_pages_text
                                      component: heading
                                      props:
                                        label: "pages/"
                                        level: 4
                                - id: sm_p_dashboard
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                    padding: 4
                                  interaction:
                                    - type: set_state
                                      stateKey: active_file
                                      value: dashboard
                                      scope: page
                                  children:
                                    - id: sm_p_dash_indent
                                      component: spacer
                                      size:
                                        width: 16
                                    - id: sm_p_dash_icon
                                      component: icon
                                      props:
                                        name: file
                                        size: sm
                                    - id: sm_p_dash_name
                                      component: text
                                      props:
                                        label: "dashboard.yaml"
                                - id: sm_p_settings
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                    padding: 4
                                  interaction:
                                    - type: set_state
                                      stateKey: active_file
                                      value: settings
                                      scope: page
                                  children:
                                    - id: sm_p_set_indent
                                      component: spacer
                                      size:
                                        width: 16
                                    - id: sm_p_set_icon
                                      component: icon
                                      props:
                                        name: file
                                        size: sm
                                    - id: sm_p_set_name
                                      component: text
                                      props:
                                        label: "settings.yaml"
                                - id: sm_p_profile
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                    padding: 4
                                  interaction:
                                    - type: set_state
                                      stateKey: active_file
                                      value: profile
                                      scope: page
                                  children:
                                    - id: sm_p_prof_indent
                                      component: spacer
                                      size:
                                        width: 16
                                    - id: sm_p_prof_icon
                                      component: icon
                                      props:
                                        name: file
                                        size: sm
                                    - id: sm_p_prof_name
                                      component: text
                                      props:
                                        label: "profile.yaml"
                                - id: sm_p_checkout
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                    padding: 4
                                  interaction:
                                    - type: set_state
                                      stateKey: active_file
                                      value: checkout
                                      scope: page
                                  children:
                                    - id: sm_p_chk_indent
                                      component: spacer
                                      size:
                                        width: 16
                                    - id: sm_p_chk_icon
                                      component: icon
                                      props:
                                        name: file
                                        size: sm
                                    - id: sm_p_chk_name
                                      component: text
                                      props:
                                        label: "checkout.yaml"
                            # Templates folder
                            - id: sm_templates_folder
                              component: section
                              layout:
                                type: stack
                                gap: 2
                              children:
                                - id: sm_tpl_label
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                  children:
                                    - id: sm_tpl_icon
                                      component: icon
                                      props:
                                        name: folder-open
                                        size: sm
                                    - id: sm_tpl_text
                                      component: heading
                                      props:
                                        label: "templates/"
                                        level: 4
                                - id: sm_t_main
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                    padding: 4
                                  children:
                                    - id: sm_t_main_indent
                                      component: spacer
                                      size:
                                        width: 16
                                    - id: sm_t_main_icon
                                      component: icon
                                      props:
                                        name: layer-group
                                        size: sm
                                    - id: sm_t_main_name
                                      component: text
                                      props:
                                        label: "main_template.yaml"
                            # Components folder
                            - id: sm_components_folder
                              component: section
                              layout:
                                type: stack
                                gap: 2
                              children:
                                - id: sm_comp_label
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                  children:
                                    - id: sm_comp_icon
                                      component: icon
                                      props:
                                        name: folder-open
                                        size: sm
                                    - id: sm_comp_text
                                      component: heading
                                      props:
                                        label: "components/"
                                        level: 4
                                - id: sm_c_nav
                                  component: section
                                  layout:
                                    type: row
                                    gap: 6
                                    align: center
                                    padding: 4
                                  children:
                                    - id: sm_c_nav_indent
