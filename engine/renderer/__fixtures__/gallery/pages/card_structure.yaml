documentType: page
specVersion: "1.1"
id: card_structure
page:
  id: card_structure
  template: app_shell
  viewport:
    device: web
  renderMode: card
  wireframeStyle:
    border:
      style: solid
      width: thin
    corner:
      style: rounded
      radius: 8
  slots:
    - slotId: main
      content:
        - id: structure_panel
          component: section
          props:
            title: Structure and hierarchy
          layout:
            type: stack
            gap: 18
          children:
            - id: nested_group
              component: section
              size:
                width: 360
              props:
                title: Demoted group with explicit size
              layout:
                type: stack
                gap: 8
              children:
                - id: nested_group_text
                  component: paragraph
                  props:
                    text: This nested section should render as wf-group, not a nested card.
            - id: grid_tiles
              component: section
              props:
                title: Grid tiles
              layout:
                type: grid
                columns: 12
                gap: 16
              children:
                - id: grid_tile_a
                  component: section
                  gridItem:
                    span: 6
                  props:
                    title: Tile A
                  children:
                    - id: tile_a_metric
                      component: heading
                      props:
                        level: 3
                        text: "128"
                - id: grid_tile_b
                  component: section
                  gridItem:
                    span: 6
                  props:
                    title: Tile B
                  children:
                    - id: tile_b_metric
                      component: heading
                      props:
                        level: 3
                        text: "64"
            - id: row_tile_group
              component: section
              layout:
                type: row
                gap: 16
              children:
                - id: promoted_tile
                  component: section
                  surface: true
                  size:
                    width: 240
                  props:
                    title: Promoted row tile
                  children:
                    - id: promoted_tile_text
                      component: text
                      props:
                        text: surface true
                - id: plain_row_group
                  component: section
                  size:
                    width: 240
                  props:
                    title: Plain row group
                  children:
                    - id: plain_row_text
                      component: text
                      props:
                        text: demoted
            - id: spacer_row
              component: section
              layout:
                type: row
                gap: 8
                align: center
              children:
                - id: spacer_left
                  component: text
                  props:
                    text: Left
                - id: flex_spacer
                  component: spacer
                  props:
                    size: 100%
                - id: spacer_right
                  component: button
                  props:
                    label: Right
            - id: data_table
              component: table
              props:
                columns:
                  - key: name
                    label: Name
                  - key: status
                    label: Status
                  - key: owner
                    label: Owner
                rows:
                  - name: Dashboard
                    status: Draft
                    owner: Lee
                  - name: Settings
                    status: Ready
                    owner: Sam
            - id: final_divider
              component: divider
