documentType: page
specVersion: "1.1"
id: auth_card
page:
  id: auth_card
  template: auth_shell
  viewport:
    device: web
  rendering:
    mode: card
    density: comfortable
  wireframeStyle:
    border:
      style: solid
      width: thin
    corner:
      style: rounded
      radius: 8
  slots:
    - slotId: main
      content:
        - id: auth_panel
          component: section
          size:
            width: 360
          layout:
            type: stack
            gap: 12
          children:
            - id: auth_title
              component: heading
              props:
                text: Sign in
                level: 1
            - id: auth_copy
              component: paragraph
              props:
                text: Centered auth layouts respect template alignment.
            - id: auth_email
              component: input
              props:
                label: Email
                placeholder: you@example.com
                inputType: email
            - id: auth_password
              component: input
              props:
                label: Password
                placeholder: Enter password
                inputType: password
            - id: auth_submit
              component: button
              props:
                label: Continue
                variant: primary
