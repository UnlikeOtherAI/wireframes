documentType: page
specVersion: "1.1"
id: line_media_charts
page:
  id: line_media_charts
  template: app_shell
  viewport:
    device: web
  renderMode: line
  pageState:
    selected_bottom_tab: line_media_home_tab
  wireframeStyle:
    border:
      style: dashed
      width: thin
    corner:
      style: sharp
  slots:
    - slotId: main
      content:
        - id: line_media_panel
          component: section
          props:
            title: Line media and charts
          layout:
            type: stack
            gap: 16
          children:
            - id: line_media_row
              component: section
              layout:
                type: row
                gap: 12
                align: center
              children:
                - id: line_placeholder_image
                  component: image
                  size:
                    width: 280
                  props:
                    alt: Line placeholder
                - id: line_icon
                  component: icon
                  props:
                    name: circle-info
                    size: xl
            - id: line_chart_grid
              component: section
              layout:
                type: grid
                columns: 12
                gap: 12
              children:
                - id: line_chart_line
                  component: chart
                  gridItem:
                    span: 6
                  props:
                    chartType: line
                    title: Line chart
                - id: line_chart_vertical
                  component: chart
                  gridItem:
                    span: 6
                  props:
                    chartType: vertical
                    title: Vertical chart
                - id: line_chart_gauge
                  component: chart
                  gridItem:
                    span: 6
                  props:
                    chartType: gauge
                    title: Gauge chart
                - id: line_chart_donut
                  component: chart
                  gridItem:
                    span: 6
                  props:
                    chartType: donut
                    title: Donut chart
            - id: line_bottom_nav
              component: bottom_tab_bar
              children:
                - id: line_media_home_tab
                  component: button
                  selection:
                    scope: page
                    stateKey: selected_bottom_tab
                  props:
                    label: Home
                    icon: house
                - id: line_media_reports_tab
                  component: button
                  selection:
                    scope: page
                    stateKey: selected_bottom_tab
                  props:
                    label: Reports
                    icon: chart-column
