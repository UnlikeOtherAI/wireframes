documentType: page
specVersion: "1.1"
id: gallery_card
page:
  id: gallery_card
  template: app_shell
  viewport:
    device: web
  rendering:
    mode: card
    density: comfortable
  wireframeStyle:
    border:
      style: solid
      width: thin
    corner:
      style: rounded
      radius: 8
  slots:
    - slotId: main
      content:
        - id: overview
          component: section
          props:
            title: Type and Actions
          layout:
            type: stack
            gap: 12
          children:
            - id: title
              component: heading
              props:
                text: Account Overview
                level: 1
            - id: subtitle
              component: paragraph
              props:
                label: Authored copy appears from label aliases, while missing content uses skeleton bars.
            - id: meta_text
              component: text
              props:
                text: Updated 2 minutes ago
                variant: meta
            - id: missing_heading
              component: heading
              props:
                level: 3
            - id: action_row
              component: section
              layout:
                type: row
                gap: 8
                align: center
              children:
                - id: primary_action
                  component: button
                  props:
                    label: Create
                    icon: plus
                    variant: primary
                - id: secondary_action
                  component: button
                  props:
                    label: Save
                    variant: secondary
                - id: ghost_action
                  component: button
                  props:
                    label: Preview
                    variant: ghost
                - id: danger_action
                  component: button
                  props:
                    label: Delete
                    variant: danger
        - id: grid_demo
          component: section
          props:
            title: Surface Hierarchy
          layout:
            type: grid
            columns: 12
            gap: 12
          children:
            - id: metric_one
              component: section
              gridItem:
                span: 4
              layout:
                type: stack
                gap: 6
              children:
                - id: metric_one_label
                  component: text
                  props:
                    text: Active users
                    variant: meta
                - id: metric_one_value
                  component: heading
                  props:
                    text: 24,800
                    level: 2
            - id: metric_two
              component: section
              gridItem:
                span: 4
              layout:
                type: stack
                gap: 6
              children:
                - id: metric_two_label
                  component: text
                  props:
                    text: Conversion
                    variant: meta
                - id: metric_two_value
                  component: heading
                  props:
                    text: 12.4%
                    level: 2
            - id: metric_three
              component: section
              gridItem:
                span: 4
              layout:
                type: stack
                gap: 6
              children:
                - id: metric_three_label
                  component: text
                  props:
                    text: Open tasks
                    variant: meta
                - id: metric_three_value
                  component: heading
                  props:
                    text: "18"
                    level: 2
            - id: explicit_nested_surface
              component: section
              surface: true
              gridItem:
                span: 6
              props:
                title: Explicit card
              children:
                - id: nested_surface_text
                  component: paragraph
                  props:
                    text: Explicit nested surfaces keep their frame.
            - id: plain_nested_group
              component: section
              gridItem:
                span: 6
              layout:
                type: row
                gap: 8
                align: center
              children:
                - id: group_icon
                  component: icon
                  props:
                    name: circle-info
                - id: group_text
                  component: text
                  props:
                    text: Rows stay readable without accidental inner cards.
        - id: form_demo
          component: section
          props:
            title: Forms and Choices
          layout:
            type: grid
            columns: 12
            gap: 12
          children:
            - id: name_input
              component: input
              gridItem:
                span: 4
              props:
                label: Project Name
                placeholder: Growth Console
            - id: owner_select
              component: select
              gridItem:
                span: 4
              props:
                label: Owner
                placeholder: Select owner
                options:
                  - label: Ada Lovelace
                    value: ada
                  - label: Grace Hopper
                    value: grace
            - id: notes_area
              component: textarea
              gridItem:
                span: 4
              props:
                label: Notes
                placeholder: Add context
                rows: 3
            - id: choices
              component: section
              gridItem:
                span: 12
              layout:
                type: row
                gap: 16
              children:
                - id: choice_checkbox
                  component: checkbox
                  props:
                    label: Notify team
                - id: choice_radio
                  component: radio
                  props:
                    label: Default workspace
                - id: choice_toggle
                  component: toggle
                  props:
                    label: Auto-save
        - id: media_data
          component: section
          props:
            title: Media and Data
          layout:
            type: grid
            columns: 12
            gap: 12
          children:
            - id: image_block
              component: image
              gridItem:
                span: 4
              props:
                alt: Product preview
            - id: chart_block
              component: chart
              gridItem:
                span: 4
              props:
                label: Usage trend
                chartType: line
            - id: table_block
              component: table
              gridItem:
                span: 4
              props:
                columns:
                  - label: Name
                    key: name
                  - label: Status
                    key: status
                rows:
                  - name: Alpha
                    status: Ready
                  - name: Beta
                    status: Review
            - id: divider
              component: divider
              gridItem:
                span: 12
            - id: tab_bar
              component: tab_bar
              gridItem:
                span: 12
              children:
                - id: tab_one
                  component: button
                  props:
                    label: Overview
                    variant: primary
                - id: tab_two
                  component: button
                  props:
                    label: Settings
                - id: tab_three
                  component: button
                  props:
                    label: Activity
            - id: spacer
              component: spacer
              props:
                size: 16
