documentType: page
specVersion: "1.1"
id: forms
page:
  id: forms
  template: app_shell
  viewport:
    device: web
    orientation: landscape
  renderMode: card
  slots:
    - slotId: main
      content:
        - id: forms_header
          component: page_header
          props:
            title: Controls
            subtitle: Every input type, choice control and button shape.

        - id: buttons_card
          component: card
          props:
            title: Buttons
          layout:
            type: stack
            gap: 16
          children:
            - id: button_variants
              component: row
              props:
                gap: 10
              children:
                - id: btn_primary
                  component: button
                  props:
                    label: Primary
                    variant: primary
                - id: btn_secondary
                  component: button
                  props:
                    label: Secondary
                - id: btn_ghost
                  component: button
                  props:
                    label: Ghost
                    variant: ghost
                - id: btn_danger
                  component: button
                  props:
                    label: Delete
                    variant: danger
                    icon: trash
                - id: btn_link
                  component: button
                  props:
                    label: Learn more
                    variant: link
                - id: btn_pressed
                  component: button
                  props:
                    label: Pinned
                    icon: thumbtack
                    pressed: true
                - id: btn_pressed_icon
                  component: button
                  props:
                    label: Bold
                    icon: bold
                    iconOnly: true
                    pressed: true
            - id: button_sizes
              component: row
              props:
                gap: 10
              children:
                - id: btn_sm
                  component: button
                  props:
                    label: Small
                    size: sm
                - id: btn_md
                  component: button
                  props:
                    label: Medium
                - id: btn_lg
                  component: button
                  props:
                    label: Large
                    size: lg
                - id: btn_loading
                  component: button
                  props:
                    label: Saving
                    loading: true
                - id: btn_disabled
                  component: button
                  props:
                    label: Disabled
                    disabled: true
                - id: toolbar_format
                  component: toolbar
                  props:
                    items:
                      - { label: Bold, icon: bold, pressed: true }
                      - { label: Italic, icon: italic, pressed: false }
                      - { label: Underline, icon: underline, pressed: false }
                      - { type: separator }
                      - type: group
                        label: Alignment
                        items:
                          - { label: Align left, icon: align-left, checked: true }
                          - { label: Align centre, icon: align-center, checked: false }
                          - { label: Align right, icon: align-right, checked: false }
                      - { type: separator }
                      - { label: Link, icon: link }
                      - { label: Delete, icon: trash, disabled: true }
            - id: button_icons
              component: row
              props:
                gap: 10
              children:
                - id: btn_icon_only
                  component: button
                  props:
                    icon: gear
                    iconOnly: true
                - id: btn_icon_label
                  component: button
                  props:
                    label: Download
                    icon: download
                - id: btn_fab
                  component: button
                  props:
                    icon: plus
                    fab: true
                    variant: primary
                - id: segmented_range
                  component: segmented
                  props:
                    options: [Day, Week, Month]
                    value: Week

        - id: text_fields_card
          component: card
          props:
            title: Text fields
          layout:
            type: grid
            columns: 3
            gap: 16
          children:
            - id: field_text
              component: input
              props:
                label: Full name
                placeholder: Ada Lovelace
                required: true
            - id: field_email
              component: input
              props:
                label: Email
                inputType: email
                placeholder: you@example.com
                help: We only use this for billing receipts.
            - id: field_password
              component: input
              props:
                label: Password
                inputType: password
                placeholder: At least 12 characters
            - id: field_search
              component: input
              props:
                label: Search
                inputType: search
                placeholder: Search projects
            - id: field_number
              component: input
              props:
                label: Seats
                inputType: number
                value: "12"
            - id: field_url
              component: input
              props:
                label: Website
                inputType: url
                placeholder: https://
            - id: field_date
              component: input
              props:
                label: Start date
                inputType: date
                placeholder: "2026-11-02"
            - id: field_time
              component: input
              props:
                label: Start time
                inputType: time
                placeholder: "09:30"
            - id: field_error
              component: input
              props:
                label: Invoice reference
                placeholder: INV-0001
                error: This reference is already in use.

        - id: special_fields_card
          component: card
          props:
            title: Specialised fields
          layout:
            type: grid
            columns: 3
            gap: 16
          children:
            - id: field_range
              component: input
              props:
                label: Budget
                inputType: range
                value: 65
            - id: field_color
              component: input
              props:
                label: Accent colour
                inputType: color
            - id: field_otp
              component: input
              props:
                label: Verification code
                inputType: otp
                length: 6
            - id: field_select
              component: select
              props:
                label: Status
                options: [Draft, In review, Published]
                placeholder: Choose a status
            - id: field_combobox
              component: select
              props:
                label: Owner
                searchable: true
                options: [Ada Lovelace, Grace Hopper, Alan Turing]
                placeholder: Search people
            - id: field_tags
              component: tags_input
              props:
                label: Labels
                tags: [urgent, billing, q4]
                placeholder: Add a label
            - id: field_textarea
              component: textarea
              props:
                label: Release notes
                rows: 4
                placeholder: What changed in this release?
                maxLength: 280
            - id: field_upload
              component: upload
              props:
                label: Drop files to upload
                hint: PNG, PDF or CSV up to 10 MB
                files:
                  - name: contract-2026.pdf
            - id: field_editor
              component: editor
              props:
                label: Description
                toolbar: true
                rows: 5

        - id: choices_card
          component: card
          props:
            title: Choices
          layout:
            type: grid
            columns: 3
            gap: 20
          children:
            - id: choice_radio_group
              component: choice_group
              props:
                label: Plan
                kind: radio
                value: Pro
                options:
                  - label: Free
                    description: One project, community support
                  - label: Pro
                    description: Unlimited projects
                  - label: Enterprise
            - id: choice_checkbox_group
              component: choice_group
              props:
                label: Notifications
                kind: checkbox
                options: [Product updates, Security alerts, Weekly digest]
            - id: choice_singles
              component: stack
              props:
                gap: 12
              children:
                - id: single_checkbox
                  component: checkbox
                  props:
                    label: Remember this device
                    checked: true
                - id: single_radio
                  component: radio
                  props:
                    label: Bill annually
                    description: Two months free
                    checked: true
                - id: single_toggle_on
                  component: toggle
                  props:
                    label: Auto-save
                    checked: true
                - id: single_toggle_off
                  component: toggle
                  props:
                    label: Public preview
                - id: single_disabled
                  component: checkbox
                  props:
                    label: Managed by your admin
                    disabled: true

        - id: form_demo
          component: card
          props:
            title: A form inside a card
          children:
            - id: profile_form
              component: form
              props:
                submit: Save changes
                columns: 2
              children:
                - id: form_first
                  component: input
                  props:
                    label: First name
                    placeholder: Ada
                - id: form_last
                  component: input
                  props:
                    label: Last name
                    placeholder: Lovelace
                - id: form_role
                  component: select
                  props:
                    label: Role
                    options: [Owner, Editor, Viewer]
                - id: form_tz
                  component: select
                  props:
                    label: Time zone
                    options: [UTC, CET, PST]

        - id: field_states_card
          component: card
          props:
            title: Field states
          layout:
            type: grid
            columns: 3
            gap: 16
          children:
            - id: fs_help_error
              component: input
              props:
                label: Coupon
                value: SPRING
                help: Applied at checkout
                error: This code has expired.
            - id: fs_readonly
              component: input
              props:
                label: Workspace URL
                value: acme.wireframe.app
                readonly: true
                help: Set by your admin; still submitted.
            - id: fs_readonly_disabled
              component: input
              props:
                label: Account ID
                value: AC-2044
                readonly: true
                disabled: true
            - id: fs_select_value
              component: select
              props:
                label: Region
                options: [EU, US, APAC]
                value: US
                required: true
            - id: fs_select_readonly
              component: select
              props:
                label: Plan
                options: [Free, Pro, Enterprise]
                value: Pro
                readonly: true
                help: Change it on the billing page.
            - id: fs_select_multiple
              component: select
              props:
                label: Channels
                multiple: true
                options: [Email, SMS, Push]
                value: [Email, Push]
            - id: fs_number
              component: input
              props:
                label: Seats
                inputType: number
                value: 12
                min: 1
                max: 50
                help: Between 1 and 50.
            - id: fs_stepper
              component: input
              props:
                label: Guests
                inputType: stepper
                value: 1
                min: 1
                max: 8
            - id: fs_range_pair
              component: input
              props:
                label: Price
                inputType: range
                value: [40, 140]
                min: 0
                max: 200
            - id: fs_segmented_field
              component: segmented
              props:
                label: View
                options: [List, Board, Calendar]
                value: Board
                help: Applies to every project.
            - id: fs_segmented_readonly
              component: segmented
              props:
                label: Billing
                options: [Monthly, Annual]
                value: Annual
                readonly: true
            - id: fs_tags_readonly
              component: tags_input
              props:
                label: Labels
                tags: [urgent, billing]
                readonly: true
            - id: fs_choices
              component: stack
              props:
                gap: 12
              children:
                - id: fs_indeterminate
                  component: checkbox
                  props:
                    label: Select all rows
                    indeterminate: true
                - id: fs_terms
                  component: checkbox
                  props:
                    label: I accept the terms
                    required: true
                    help: Required to create an account.
                    error: Accept the terms to continue.
                - id: fs_toggle_readonly
                  component: toggle
                  props:
                    label: Single sign-on
                    checked: true
                    readonly: true
                - id: fs_radio_disabled
                  component: radio
                  props:
                    label: Legacy plan
                    checked: true
                    disabled: true
            - id: fs_choice_list
              component: choice_group
              props:
                label: Notify me by
                kind: checkbox
                options: [Email, SMS, Push]
                value: [Email, Push]
                help: Pick at least one.
            - id: fs_choice_error
              component: choice_group
              props:
                label: Support tier
                kind: radio
                required: true
                options: [Community, Priority]
                error: Choose a support tier.
            - id: fs_upload
              component: upload
              props:
                fieldLabel: Attachments
                label: Drop files to upload
                hint: PDF up to 10 MB
                required: true
                help: Shared with your team.
            - id: fs_upload_readonly
              component: upload
              props:
                fieldLabel: Signed contract
                readonly: true
                files:
                  - name: contract-2026.pdf
            - id: fs_editor_readonly
              component: editor
              props:
                label: Release notes
                readonly: true
                rows: 3
            - id: fs_picker_error
              component: picker
              props:
                label: Repeat
                options: [Never, Daily, Weekly, Monthly]
                value: Weekly
                error: Pick a schedule that ends.

        - id: toolbars_card
          component: card
          props:
            title: Toolbars
          children:
            - id: toolbar_row
              component: row
              props:
                gap: 16
                align: start
              children:
                - id: tb_labels
                  component: toolbar
                  props:
                    labels: true
                    items:
                      - { label: Undo, icon: rotate-left }
                      - { label: Redo, icon: rotate-right, disabled: true }
                      - { type: separator }
                      - { label: Comment, icon: comment, pressed: true }
                - id: tb_small
                  component: toolbar
                  props:
                    size: sm
                    items:
                      - { label: Bold, icon: bold }
                      - { label: Strikethrough, icon: strikethrough, pressed: true }
                      - { label: Bullets, icon: list-ul }
                - id: tb_large
                  component: toolbar
                  props:
                    size: lg
                    items:
                      - { label: Play, icon: play }
                      - { label: Shuffle, icon: shuffle, checked: mixed }
                      - { label: Mute, icon: volume-xmark, pressed: false }
                - id: tb_stack
                  component: toolbar
                  props:
                    orientation: stack
                    items:
                      - { label: Select, icon: arrow-pointer, pressed: true }
                      - { label: Pan, icon: hand }
                      - { type: separator }
                      - { label: Zoom in, icon: magnifying-glass-plus }
