documentType: page
specVersion: "1.1"
id: navigation_elements
page:
  id: navigation_elements
  template: app_shell
  viewport:
    device: web
    orientation: landscape
  renderMode: card
  slots:
    - slotId: main
      content:
        - id: nav_header
          component: page_header
          props:
            title: Navigation
            subtitle: Wayfinding elements, each one node.
            breadcrumb:
              - label: Gallery
                route: content
              - label: Navigation
            actions:
              - label: Share
                icon: share-nodes
            tabs:
              - label: Overview
                active: true
              - label: Usage
              - label: History

        - id: breadcrumb_card
          component: card
          props:
            title: Breadcrumb
          children:
            - id: breadcrumb_demo
              component: breadcrumb
              props:
                items:
                  - label: Projects
                    route: content
                  - label: Acme Dashboard
                  - label: Settings

        - id: tabs_card
          component: card
          props:
            title: Tab variants
          layout:
            type: stack
            gap: 18
          children:
            - id: tabs_underline
              component: tab_bar
              props:
                tabs:
                  - label: Overview
                    icon: gauge
                    active: true
                  - label: Members
                    icon: users
                    badge: 12
                  - label: Billing
                    icon: credit-card
            - id: tabs_pill
              component: tab_bar
              props:
                variant: pill
                tabs:
                  - label: All
                    active: true
                  - label: Active
                  - label: Archived
            - id: tabs_enclosed
              component: tab_bar
              props:
                variant: enclosed
                tabs:
                  - label: Design
                    active: true
                  - label: Code
                  - label: Preview

        - id: stepper_card
          component: card
          props:
            title: Steppers
          layout:
            type: grid
            columns: 2
            gap: 28
          children:
            - id: stepper_row
              component: stepper
              props:
                current: 2
                steps: [Account, Workspace, Invite, Done]
            - id: stepper_stack
              component: stepper
              props:
                orientation: stack
                current: 3
                steps: [Upload, Map columns, Review, Import]

        - id: pagination_card
          component: card
          props:
            title: Pagination
          layout:
            type: stack
            gap: 16
          children:
            - id: pagination_numbers
              component: pagination
              props:
                page: 4
                pages: 12
            - id: pagination_simple
              component: pagination
              props:
                variant: simple
                page: 2
                pages: 9
            - id: pagination_dots
              component: pagination
              props:
                variant: dots
                page: 2
                pages: 5

        - id: nav_menu_row
          component: grid
          props:
            columns: 3
          children:
            - id: nav_expanded_card
              component: card
              props:
                title: Side navigation
              children:
                - id: nav_expanded
                  component: nav
                  props:
                    items:
                      - group: Workspace
                      - label: Dashboard
                        icon: gauge
                        active: true
                      - label: Projects
                        icon: folder
                        badge: 8
                      - label: Reports
                        icon: chart-simple
                        children:
                          - label: Weekly
                          - label: Monthly
                      - group: Account
                      - label: Settings
                        icon: gear
            - id: nav_collapsed_card
              component: card
              props:
                title: Collapsed rail
              children:
                - id: nav_collapsed
                  component: nav
                  props:
                    collapsed: true
                    items:
                      - label: Dashboard
                        icon: gauge
                        active: true
                      - label: Projects
                        icon: folder
                      - label: Reports
                        icon: chart-simple
                      - label: Settings
                        icon: gear
            - id: menu_card
              component: card
              props:
                title: Menu contents
              children:
                - id: menu_demo
                  component: menu
                  props:
                    items:
                      - label: Rename
                        icon: pen
                        shortcut: "⌘R"
                      - label: Duplicate
                        icon: copy
                      - divider: true
                      - label: Move to archive
                        icon: box-archive
                      - label: Delete
                        icon: trash
                        danger: true

        - id: item_states_card
          component: card
          props:
            title: Item states
          layout:
            type: grid
            columns: 3
            gap: 28
          children:
            - id: states_tabs
              component: tab_bar
              props:
                tabs:
                  - label: Overview
                  - label: Usage
                    selected: true
                  - label: Billing
                    disabled: true
            - id: states_breadcrumb
              component: breadcrumb
              props:
                separator: ›
                items:
                  - label: Projects
                    route: content
                  - label: Archived
                    route: content
                    disabled: true
                  - label: Acme
                    current: true
                  - label: Settings
                    route: forms
            - id: states_stepper
              component: stepper
              props:
                steps:
                  - label: Cart
                  - label: Plan
                    selected: true
                  - label: Pay
                    disabled: true
            - id: states_nav
              component: nav
              props:
                items:
                  - type: heading
                    label: Workspace
                  - label: Navigation
                    icon: compass
                    route: navigation_elements
                    selected: false
                  - label: Reports
                    icon: chart-simple
                    expanded: true
                    items:
                      - label: Weekly
                        selected: true
                      - label: Monthly
                  - label: Archive
                    icon: box-archive
                    expanded: false
                    items: [2024, 2025]
                  - type: separator
                  - label: Billing
                    icon: credit-card
                    disabled: true
                    route: forms
            - id: states_menu
              component: menu
              props:
                items:
                  - type: group
                    label: Document
                    items:
                      - label: Open
                        icon: folder-open
                        current: true
                      - label: Rename
                        icon: pen
                        shortcut: "⌘R"
                        selected: true
                      - label: Share
                        icon: share-nodes
                        disabled: true
                  - type: separator
                  - label: Delete
                    icon: trash
                    tone: danger
            - id: states_bottom_tabs
              component: bottom_tab_bar
              props:
                tabs:
                  - label: Home
                    icon: house
                  - label: Search
                    icon: magnifying-glass
                    current: true
                  - label: Inbox
                    icon: inbox
                    disabled: true

        - id: command_card
          component: card
          props:
            title: Command palette
          layout:
            type: grid
            columns: 2
            gap: 28
          children:
            - id: command_demo
              component: command
              props:
                placeholder: Search or run a command
                footer: true
                items:
                  - type: group
                    label: Suggestions
                    items:
                      - label: New project
                        icon: plus
                        shortcut: "⌘N"
                        selected: true
                      - label: Invite teammates
                        icon: user-plus
                        description: Send an email invite
                        shortcut: "⌘⇧I"
                      - label: Billing
                        icon: credit-card
                        description: Plan and invoices
                        disabled: true
                  - type: group
                    label: Navigation
                    items:
                      - label: Go to dashboard
                        icon: gauge
                        route: content
                        shortcut: G D
                      - label: Open settings
                        icon: gear
                        route: forms
                        shortcut: "⌘,"
            - id: command_empty
              component: command
              props:
                query: quarterly forecast
                empty: No commands match this search.

        - id: menubar_card
          component: card
          props:
            title: Menubar
          size:
            minHeight: 300
          children:
            - id: menubar_demo
              component: menubar
              props:
                open: Edit
                items:
                  - label: File
                    items: [New, Open, Save]
                  - label: Edit
                    items:
                      - label: Undo
                        shortcut: "⌘Z"
                      - label: Redo
                        shortcut: "⇧⌘Z"
                        disabled: true
                      - type: separator
                      - type: group
                        label: Clipboard
                        items:
                          - label: Cut
                            shortcut: "⌘X"
                          - label: Copy
                            shortcut: "⌘C"
                            selected: true
                          - label: Paste
                            shortcut: "⌘V"
                      - type: separator
                      - label: Find
                        items: [Find…, Replace…]
                  - label: View
                    items: [Zoom in, Zoom out]
                  - label: Window
                    disabled: true
                    items: [Minimise]
                  - label: Help

        - id: top_nav_card
          component: card
          props:
            title: Top navigation
          size:
            minHeight: 380
          children:
            - id: top_nav_demo
              component: nav
              props:
                variant: top
                open: Products
                items:
                  - label: Products
                    items:
                      - label: Analytics
                        icon: chart-line
                        description: Dashboards and reports for every team.
                        route: charts
                      - label: Automation
                        icon: bolt
                        description: Workflows that run on a schedule.
                        route: forms
                        current: true
                      - type: separator
                      - label: Integrations
                        icon: plug
                        description: Coming soon.
                        disabled: true
                  - label: Solutions
                    items: [Startups, Enterprise]
                  - label: Pricing
                    route: data
                  - label: Docs
                    route: content
                  - type: separator
                  - label: Changelog
                    disabled: true
                    route: content
