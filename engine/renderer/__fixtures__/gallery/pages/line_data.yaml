documentType: page
specVersion: "1.1"
id: line_data
page:
  id: line_data
  template: app_shell
  viewport:
    device: web
    orientation: landscape
  renderMode: line
  slots:
    - slotId: main
      content:
        - id: line_data_header
          component: page_header
          props:
            title: Line mode — data
        - id: line_table
          component: table
          props:
            caption: Projects
            selectable: true
            columns:
              - label: Name
                key: name
                sortable: true
              - label: Owner
                key: owner
                kind: avatar
              - label: Status
                key: status
                kind: badge
              - label: Seats
                key: seats
                align: right
            rows:
              - name: Acme Dashboard
                owner: Ada Lovelace
                status: Live
                seats: "12"
              - name: Client Portal
                owner: Grace Hopper
                status: Draft
                seats: "4"
              - name: Checkout Flow
                owner: Alan Turing
                status: In review
                seats: "9"
        - id: line_two_up
          component: grid
          props:
            columns: 2
          children:
            - id: line_list_card
              component: card
              props:
                title: Activity
              children:
                - id: line_list
                  component: list
                  props:
                    kind: avatar
                    items:
                      - title: Ada Lovelace
                        text: Invited you to Acme Dashboard
                        meta: 2h
                      - title: Grace Hopper
                        text: Commented on Checkout Flow
                        meta: 5h
            - id: line_chart_card
              component: card
              props:
                title: Signups
              children:
                - id: line_chart
                  component: chart
                  props:
                    chartType: area
        - id: line_tree_card
          component: card
          props:
            title: Accordion and tree
          layout:
            type: grid
            columns: 2
            gap: 16
          children:
            - id: line_accordion
              component: accordion
              props:
                items:
                  - title: How does billing work?
                    text: Billed monthly for seats in use.
                    open: true
                  - title: Can I change plans?
            - id: line_tree
              component: tree
              props:
                items:
                  - label: src
                    children:
                      - label: index.js
                      - label: render.js

        # --- Line mode: gantt, item states and routes ---
        - id: line_gantt
          component: chart
          props:
            chartType: gantt
            title: Release plan
            ticks: [W1, W2, W3, W4]
            data:
              - { label: Design, start: 0, end: 8 }
              - { label: Build, start: 6, end: 20, tone: info }
              - { label: Launch, start: 19, end: 20, tone: success }
        - id: line_items_grid
          component: grid
          props:
            columns: 2
          children:
            - id: line_gantt_placeholders
              component: card
              props:
                title: Gantt placeholders
              children:
                - id: line_gantt_seeded
                  component: chart
                  props:
                    chartType: gantt
                - id: line_gantt_empty
                  component: chart
                  props:
                    chartType: gantt
                    data: []
            - id: line_list_states_card
              component: card
              props:
                title: Selected, disabled and routed rows
              children:
                - id: line_list_states
                  component: list
                  props:
                    items:
                      - { label: Weekly digest, description: Every Monday, selected: true }
                      - { label: Mentions, selected: false }
                      - { label: Billing alerts, description: Owners only, selected: true, disabled: true }
                      - { label: Charts, description: Opens the charts page, route: charts }
            - id: line_tree_states
              component: tree
              props:
                items:
                  - label: src
                    items:
                      - { label: index.js, selected: true }
                      - { label: render.js }
                  - { label: test, expanded: false, items: [render.test.js] }
            - id: line_accordion_states
              component: accordion
              props:
                items:
                  - { label: Who can see this?, description: Everyone with a seat., expanded: true }
                  - { label: Can I export it? }
