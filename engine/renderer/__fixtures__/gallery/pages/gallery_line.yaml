documentType: page
specVersion: "1.1"
id: gallery_line
page:
  id: gallery_line
  template: app_shell
  viewport:
    device: web
  rendering:
    mode: line
    density: compact
  wireframeStyle:
    border:
      style: dashed
      width: medium
    corner:
      style: rounded
      radius: 8
  slots:
    - slotId: main
      content:
        - id: line_overview
          component: section
          props:
            title: Line Mode Components
          layout:
            type: row
            gap: 0
            padding: 18
            separators: between
            separatorStyle: dashed
          children:
            - id: line_left
              component: section
              layout:
                type: stack
                gap: 8
              children:
                - id: line_title
                  component: heading
                  props:
                    label: Blueprint View
                    level: 2
                - id: line_copy
                  component: paragraph
                  props:
                    text: Buttons use borders instead of bracket characters.
                - id: line_button
                  component: button
                  props:
                    label: Filters
                    variant: primary
                - id: line_missing
                  component: text
            - id: line_middle
              component: section
              layout:
                type: stack
                gap: 8
              children:
                - id: line_input
                  component: input
                  props:
                    label: Search
                    placeholder: Query
                - id: line_select
                  component: select
                  props:
                    label: Status
                    placeholder: Any status
                    options:
                      - Active
                      - Archived
                - id: line_toggle
                  component: toggle
                  props:
                    label: Enabled
            - id: line_right
              component: section
              layout:
                type: stack
                gap: 8
              children:
                - id: line_chart
                  component: chart
                  props:
                    label: Funnel
                    chartType: horizontal
                - id: line_table
                  component: table
                  props:
                    columns:
                      - label: Stage
                        key: stage
                      - label: Count
                        key: count
                    rows:
                      - stage: Draft
                        count: "4"
                      - stage: Live
                        count: "9"
        - id: line_tabs
          component: bottom_tab_bar
          children:
            - id: line_home_tab
              component: button
              props:
                label: Home
                icon: house
            - id: line_files_tab
              component: button
              props:
                label: Files
                icon: folder
            - id: line_settings_tab
              component: button
              props:
                label: Settings
                icon: gear
