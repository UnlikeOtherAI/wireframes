documentType: page
specVersion: "1.1"
id: auth_line
page:
  id: auth_line
  template: auth_shell
  viewport:
    device: web
  rendering:
    mode: line
    density: compact
  wireframeStyle:
    border:
      style: dashed
      width: medium
    corner:
      style: rounded
      radius: 8
  slots:
    - slotId: main
      content:
        - id: auth_panel_line
          component: section
          size:
            width: 360
          layout:
            type: stack
            gap: 10
          children:
            - id: auth_title_line
              component: heading
              props:
                text: Sign in
                level: 1
            - id: auth_email_line
              component: input
              props:
                label: Email
                placeholder: you@example.com
                inputType: email
            - id: auth_submit_line
              component: button
              props:
                label: Continue
                variant: primary
