documentType: templates
specVersion: "1.1"
id: templates
templates:
  app_shell:
    layout:
      type: row
      gap: 0
      padding: 0
      align: stretch
    regions:
      - id: gallery_nav
        kind: persistent
        role: sidebar
        layout:
          type: stack
          gap: 10
          padding: 14
        children:
          - id: gallery_brand
            component: heading
            props:
              level: 4
              text: Element gallery
          - id: gallery_menu
            component: nav
            props:
              items:
                - group: Families
                - label: Content
                  icon: font
                  route: content
                - label: Controls
                  icon: keyboard
                  route: forms
                - label: Navigation
                  icon: compass
                  route: navigation_elements
                - label: Data
                  icon: table
                  route: data
                - label: Charts and structures
                  icon: chart-simple
                  route: charts
                - label: Containers and frames
                  icon: square
                  route: containers
                - label: Overlays
                  icon: window-restore
                  route: overlays_elements
                - group: Line mode
                - label: Line structure
                  icon: border-all
                  route: line_structure
                - label: Line controls
                  icon: pen-ruler
                  route: line_forms
                - label: Line data
                  icon: list
                  route: line_data
      - id: main
        kind: slot
        role: main
        layout:
          type: stack
          gap: 20
          padding: 24
  mobile_shell:
    layout:
      type: stack
      gap: 0
      padding: 0
      align: stretch
    regions:
      - id: mobile_main
        kind: slot
        role: main
        layout:
          type: stack
          gap: 14
          padding: 14
  auth_shell:
    layout:
      type: stack
      align: center
      justify: center
      gap: 16
      padding: 32
    regions:
      - id: auth_main
        kind: slot
        role: main
        layout:
          type: stack
          gap: 16
          align: center
